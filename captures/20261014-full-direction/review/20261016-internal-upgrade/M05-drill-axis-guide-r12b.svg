<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#c02632"/></marker></defs><rect width="1200" height="1200" fill="white"/><g font-family="Arial" fill="#1d314d"><text x="45" y="52" font-size="24">RIGHT ARM AXIS GUIDE - GEOMETRY ONLY</text><text x="45" y="104" font-size="20">LEFT SIDE: nose/front is LEFT</text><text x="650" y="104" font-size="20">REAR: drill points INTO screen</text></g><path d="M600 80V610" stroke="#aaa"/><g stroke="#243048" stroke-width="5"><path d="M486 151L510 151L520 278L480 300L456 278Z" fill="#eee7d8"/><circle cx="480" cy="298" r="32" fill="#e9ae30"/><path d="M480 269L480 331L333 347L320 277Z" fill="#163663"/><path d="M350 278L350 344" stroke="#e9ae30" stroke-width="16"/><ellipse cx="320" cy="311" rx="24" ry="57" fill="#e9ae30"/><path d="M300 264L70 350L315 360Z" fill="#d9a12b"/><path d="M260 278L275 351M211 299L224 351M161 318L174 350M114 334L122 350" stroke="#4d4432" stroke-width="6"/><path d="M500 307L80 350" fill="none" stroke="#c02632" stroke-width="5" marker-end="url(#a)"/></g><g font-family="Arial" font-size="17" fill="#243048"><text x="45" y="420">Elbow bends, forearm and drill share ONE axis.</text><text x="45" y="448">Point forward with only a slight downward pitch.</text><text x="45" y="476">Do not hang the cone out the back of the wrist.</text></g><g stroke="#243048" stroke-width="5"><path d="M855 154L895 154L917 284L872 310L838 279Z" fill="#eee7d8"/><circle cx="880" cy="294" r="33" fill="#e9ae30"/><path d="M821 284L946 284L960 376L826 380Z" fill="#163663"/><path d="M832 300L943 298M834 357L950 351" stroke="#e9ae30" stroke-width="15"/><ellipse cx="887" cy="356" rx="73" ry="65" fill="#e9ae30"/><ellipse cx="887" cy="356" rx="53" ry="47" fill="#242b33"/><path d="M864 339L907 339L917 356L905 377L867 377L856 358Z" fill="#38414b"/><path d="M1002 520L1064 577M1064 520L1002 577" stroke="#c02632" stroke-width="8"/><path d="M1025 422L1111 567L1026 538Z" fill="#e9ae30"/></g><g font-family="Arial" font-size="17" fill="#243048"><text x="652" y="447">Rear collar is NEAREST viewer.</text><text x="652" y="475">Cone and point are on FAR side, HIDDEN.</text><text x="652" y="503">No triangle below/right of the rear cap.</text><text x="652" y="600">Preserve tall body, shield and new backpack.</text></g></svg>
