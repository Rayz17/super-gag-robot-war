<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="650" viewBox="0 0 1240 650" role="img" aria-labelledby="title desc">
<title id="title">社勇王四机来源与双臂炮筒叠加关系</title><desc id="desc">完整勇拳核心加轰炸机、海底列车、钻探机；先加强原双臂双拳，再把两节列车以车头朝后、中段两侧打开的炮筒形式外挂。V19定身高与头身比例，V11双拳加强至V17重量。炮筒图源疑似V20未核对，结构按用户明确要求。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="#247a82"/></marker><style>text{font-family:-apple-system,'PingFang SC','Noto Sans CJK SC',sans-serif;fill:#193545}.title{font-size:27px;font-weight:750}.head{font-size:19px;font-weight:750}.label{font-size:16px}.small{font-size:13px;fill:#526b75}.line{stroke:#247a82;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style></defs>
<rect width="1240" height="650" fill="#eeeadd" rx="12"/>
<text x="34" y="47" class="title">社勇王：同一完整核心 + 三台外部机</text><text x="34" y="73" class="small">先确认部件身份与组合轮廓，再统一 KINETIC_CEL 画法；此图不替代正式机设。</text>
<g transform="translate(34 100)"><rect width="260" height="132" rx="7" fill="#dce8e5"/><text x="17" y="31" class="head">勇拳核心 · V11方向</text><text x="17" y="61" class="label">完整人形、长发、突出双拳</text><text x="17" y="87" class="label">V11双拳 → 强化至V17重量</text><text x="17" y="112" class="small">核心始终在场，不变成拳头内胆</text></g>
<g transform="translate(322 100)"><rect width="260" height="132" rx="7" fill="#e1e6ed"/><text x="17" y="31" class="head">轰炸机 · V17上覆</text><text x="17" y="61" class="label">机身/翼壳覆盖肩背上身</text><text x="17" y="87" class="label">结合V18胸甲，保留横向轮廓</text><text x="17" y="112" class="small">同一机鼻，不叠出第二架飞机</text></g>
<g transform="translate(610 100)"><rect width="280" height="132" rx="7" fill="#efe0cd"/><text x="17" y="31" class="head">海底列车 · 双臂外挂</text><text x="17" y="61" class="label">拆两节，车头朝后</text><text x="17" y="87" class="label">中段左右打开 → 炮筒</text><text x="17" y="112" class="small">结构已明确；疑似V20版本待核对</text></g>
<g transform="translate(918 100)"><rect width="288" height="132" rx="7" fill="#e7e1cf"/><text x="17" y="31" class="head">地面钻探机 · V18腿部</text><text x="17" y="61" class="label">履带腿甲、钻头与宽足</text><text x="17" y="87" class="label">胸腿组织融入V19头身比例</text><text x="17" y="112" class="small">重新组织比例，不纵向拉伸图片</text></g>
<path d="M164 242V266H1062V242M452 242V266M750 242V266M610 266V295" class="line"/>
<rect x="337" y="299" width="565" height="55" rx="7" fill="#193d4d"/><text x="620" y="334" text-anchor="middle" style="font-size:21px;font-weight:700;fill:#f7edd5">V19头身比例 · V17巨拳重量 · 四机来源</text>
<text x="34" y="397" class="head">平举前臂侧视：后 ← 车头端　｜　拳头 / 炮口 → 前</text>
<g transform="translate(34 420)"><rect width="342" height="155" rx="7" fill="#f9f5e8"/><text x="14" y="28" class="label">① 两节列车分别确定方向</text><path d="M30 99 65 66H295V115H65Z" fill="#ecebdc" stroke="#233f4f" stroke-width="3"/><rect x="83" y="74" width="72" height="21" rx="3" fill="#416271"/><rect x="169" y="74" width="53" height="21" rx="3" fill="#416271"/><path d="M53 105H284" stroke="#d98339" stroke-width="6"/><text x="25" y="139" class="small">车头向后　←　　　　　　→　前</text></g>
<path d="M386 498H416" class="line"/>
<g transform="translate(426 420)"><rect width="342" height="155" rx="7" fill="#f9f5e8"/><text x="14" y="28" class="label">② 中段向两侧打开</text><path d="M39 83 70 58H273L292 78H83Z" fill="#ecbe7b" stroke="#244655" stroke-width="3"/><path d="M70 110H273L292 130H83Z" fill="#ecbe7b" stroke="#244655" stroke-width="3"/><path d="M85 96H266" stroke="#4d6571" stroke-width="10" stroke-dasharray="9 6"/><text x="38" y="147" class="small">中间形成容纳强化前臂的开敞结构</text></g>
<path d="M780 498H810" class="line"/>
<g transform="translate(820 420)"><rect width="386" height="155" rx="7" fill="#f9f5e8"/><text x="14" y="28" class="label">③ 强化拳在内，列车炮筒在外</text><path d="M34 71 66 53H293V76H66Z" fill="#e9b46c" stroke="#244655" stroke-width="3"/><path d="M66 114H293V136H66L34 120Z" fill="#e9b46c" stroke="#244655" stroke-width="3"/><rect x="80" y="83" width="214" height="25" rx="10" fill="#44616a"/><rect x="277" y="76" width="57" height="39" rx="9" fill="#263f4d"/><path d="M324 87H347M324 102H347" stroke="#c7d8d4" stroke-width="4"/><text x="33" y="149" class="small">双臂用同一机制，巨拳与关节保留可见</text></g>
<text x="34" y="617" class="small">图示只表达来源、前后与叠加层次，不规定精密装配尺寸；两侧打开的真实方向由后续正面/侧面机设确认。</text>
</svg>
