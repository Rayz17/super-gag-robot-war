<path d="M557 236L557 326" fill="none" stroke="#202b31" stroke-width="7"/>
<!-- The white core shoulder cap and upper arm remain BELOW the wing/engine. -->
<circle cx="512" cy="426" r="69" fill="#303940"/>
<circle cx="512" cy="426" r="44" fill="#dd792c"/>
<path d="M453 386L536 376L582 407L595 465L565 501L531 464L500 433L465 451L438 430Z" fill="#e8e6dd"/>
<path d="M494 466L548 478L570 626L548 684L491 658L471 527Z" fill="#454c51"/>
<path d="M507 495L549 510L559 597L514 592Z" fill="#dddcd4"/>
