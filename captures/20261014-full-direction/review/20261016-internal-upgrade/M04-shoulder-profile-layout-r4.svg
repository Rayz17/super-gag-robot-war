<g font-family="Arial,sans-serif" fill="#163847">
<path d="M295 85H112" fill="none" stroke="#163847" stroke-width="5" marker-end="url(#arrow)"/><text x="310" y="93" font-size="24">FRONT / LEFT</text>
<text x="70" y="780" font-size="25">SIDE LAYOUT GUIDE ONLY</text>
<text x="70" y="825" font-size="20">Wing: thin edge; engine axis faces left.</text>
<text x="70" y="860" font-size="20">Blunt nose faces left; two separate joints.</text>
<text x="70" y="895" font-size="20">Ivory shoulder cap remains below the engine.</text>
</g></svg>
