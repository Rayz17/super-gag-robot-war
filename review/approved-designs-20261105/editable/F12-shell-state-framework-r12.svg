<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="740" viewBox="0 0 1500 740"><defs><style>text{font-family:Arial,'PingFang SC',sans-serif;fill:#21363e}.t{font-size:26px;font-weight:700}.b{font-size:22px}.s{font-size:19px}</style><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#cc5c26"/></marker></defs><rect width="1500" height="740" fill="#f3f0e5"/><text x="48" y="57" font-size="35" font-weight="800">列车臂壳：核心前臂固定，两片外壳转动</text><text x="48" y="100" class="b">从拳前看向肘后：车头在后；前臂与拳不跟着壳体拆开。小翼固定在自己的壳上折收。</text>
<g transform="translate(380 340)"><circle r="82" fill="#303b42" stroke="#1a2d34" stroke-width="5"/><circle r="61" fill="none" stroke="#d66a28" stroke-width="18"/><path d="M-126 103Q-205-62-88-138L-55-110Q-141-48-93 81Z" fill="#f5ead5" stroke="#25363d" stroke-width="6"/><path d="M126 103Q205-62 88-138L55-110Q141-48 93 81Z" fill="#f5ead5" stroke="#25363d" stroke-width="6"/><path d="M-111 18L-132 59-103 71Z" fill="#deded0" stroke="#25363d" stroke-width="4"/><path d="M-113 49Q-104 28-109 12" fill="none" stroke="#cc5c26" stroke-width="4" marker-end="url(#arrow)"/><text x="0" y="181" text-anchor="middle" class="t">保护护套：内侧保留开口</text><text x="0" y="219" text-anchor="middle" class="s">外壳靠近前臂，小翼贴回自身壳体</text></g>
<g transform="translate(1090 340)"><circle r="82" fill="#303b42" stroke="#1a2d34" stroke-width="5"/><circle r="61" fill="none" stroke="#d66a28" stroke-width="18"/><path d="M-116 96L-281-27-268-65-88 56Z" fill="#f5ead5" stroke="#25363d" stroke-width="6"/><path d="M116 96L281-27 268-65 88 56Z" fill="#f5ead5" stroke="#25363d" stroke-width="6"/><circle cx="-111" cy="90" r="13" fill="#cc5c26" stroke="#25363d" stroke-width="4"/><circle cx="111" cy="90" r="13" fill="#cc5c26" stroke="#25363d" stroke-width="4"/><path d="M-173 52L-204 27-183 13Z" fill="#deded0" stroke="#25363d" stroke-width="4"/><path d="M-100-132Q-222-122-256-68" fill="none" stroke="#cc5c26" stroke-width="5" marker-end="url(#arrow)"/><path d="M100-132Q222-122 256-68" fill="none" stroke="#cc5c26" stroke-width="5" marker-end="url(#arrow)"/><text x="0" y="181" text-anchor="middle" class="t">炮击展开：两壳向左右打开</text><text x="0" y="219" text-anchor="middle" class="s">同一小翼仍贴在原壳；不另生车头或炮筒</text></g>
<path d="M655 340H779" fill="none" stroke="#cc5c26" stroke-width="7" marker-end="url(#arrow)"/>
<text x="50" y="637" class="b">腕环：绑定同一腕部。核心裸露时可见；合体护甲遮挡大部，只在原位置留窄缝，发动时增亮。</text><text x="50" y="688" class="s">这是状态与部件归属示意，不是精确机械剖面；机体、巨拳和臂壳造型仍以已选整机及本轮细图为准。</text></svg>