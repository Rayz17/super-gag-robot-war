<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="850" viewBox="0 0 1160 850" role="img" aria-labelledby="title desc"><title id="title">通用机制怎样驱动四种呈现</title><desc id="desc">以“顶推工机”为例：不是四处各写一份解释，而是一份模拟结果被四个界面读取。。整改设计示意，非实机截图。</desc><g font-family="PingFang SC,Noto Sans CJK SC,sans-serif"><rect x="0" y="0" width="1160" height="850" rx="18" fill="#f0f0e7" stroke="none" stroke-width="1" /><text x="34" y="47" font-size="30" fill="#233d4b" font-weight="700" text-anchor="start">G14  通用机制怎样驱动四种呈现</text><text x="34" y="81" font-size="19" fill="#607682" font-weight="400" text-anchor="start">以“顶推工机”为例：不是四处各写一份解释，而是一份模拟结果被四个界面读取。</text><text x="1126" y="830" font-size="16" fill="#607682" font-weight="400" text-anchor="end">整改设计示意 · 非实机 · 参数为示例</text><rect x="34" y="123" width="346" height="140" rx="12" fill="#fffdf5" stroke="#cedbd3" stroke-width="1" /><circle cx="60" cy="152" r="16" fill="#197a82" stroke="none" stroke-width="2"/><text x="60" y="159" font-size="19" fill="#fffdf5" font-weight="700" text-anchor="middle">1</text><text x="86" y="159" font-size="22" fill="#233d4b" font-weight="650" text-anchor="start">对象与装备</text><text x="60" y="205" font-size="20" fill="#233d4b" font-weight="400" text-anchor="start">脚印 / 质量 / 身份</text><text x="60" y="234" font-size="20" fill="#233d4b" font-weight="400" text-anchor="start">工具 / 主行动 / 资源</text><path d="M381 195L404 195" fill="none" stroke="#197a82" stroke-width="3" stroke-linecap="round"/><polygon points="404,195 392.1834452542265,200.41932043157973 392.1834452542265,189.58067956842027" fill="#197a82"/><rect x="407" y="123" width="346" height="140" rx="12" fill="#fffdf5" stroke="#cedbd3" stroke-width="1" /><circle cx="433" cy="152" r="16" fill="#197a82" stroke="none" stroke-width="2"/><text x="433" y="159" font-size="19" fill="#fffdf5" font-weight="700" text-anchor="middle">2</text><text x="459" y="159" font-size="22" fill="#233d4b" font-weight="650" text-anchor="start">玩家命令</text><text x="433" y="205" font-size="20" fill="#233d4b" font-weight="400" text-anchor="start">发起者 + 目标 + 方向</text><text x="433" y="234" font-size="20" fill="#233d4b" font-weight="400" text-anchor="start">路线 + 状态版本</text><path d="M754 195L777 195" fill="none" stroke="#197a82" stroke-width="3" stroke-linecap="round"/><polygon points="777,195 765.1834452542265,200.41932043157973 765.1834452542265,189.58067956842027" fill="#197a82"/><rect x="780" y="123" width="346" height="140" rx="12" fill="#fffdf5" stroke="#cedbd3" stroke-width="1" /><circle cx="806" cy="152" r="16" fill="#197a82" stroke="none" stroke-width="2"/><text x="806" y="159" font-size="19" fill="#fffdf5" font-weight="700" text-anchor="middle">3</text><text x="832" y="159" font-size="22" fill="#233d4b" font-weight="650" text-anchor="start">一次规则模拟</text><text x="806" y="205" font-size="20" fill="#233d4b" font-weight="400" text-anchor="start">校验 → 伤害 → 位移</text><text x="806" y="234" font-size="20" fill="#233d4b" font-weight="400" text-anchor="start">碰撞 → 坠落 → 连锁</text><path d="M950 265L950 311" fill="none" stroke="#197a82" stroke-width="4" stroke-linecap="round"/><polygon points="950,311 944.163808765991,298.2744795045516 955.836191234009,298.2744795045516" fill="#197a82"/><rect x="34" y="318" width="1092" height="161" rx="10" fill="#dce7df" stroke="#197a82" stroke-width="2" /><text x="57" y="355" font-size="26" fill="#197a82" font-weight="700" text-anchor="start">结果账：谁改变了谁，在哪个阶段，为什么</text><text x="57" y="392" font-size="20" fill="#233d4b" font-weight="400" text-anchor="start">本手：工机被推一格 → 离开桥接口 → 本轮拆解取消</text><text x="57" y="422" font-size="20" fill="#233d4b" font-weight="400" text-anchor="start">另一条承诺：A 敌炮仍在 → 桥来袭伤害由 5 降到 2</text><text x="57" y="452" font-size="20" fill="#233d4b" font-weight="400" text-anchor="start">每条记录都有对象、前后值、来源和父事件；市政保全没有损失。</text><path d="M161 483L161 523" fill="none" stroke="#197a82" stroke-width="3" stroke-linecap="round"/><polygon points="161,523 155.58067956842027,511.1834452542265 166.41932043157973,511.1834452542265" fill="#197a82"/><rect x="34" y="533" width="261" height="182" rx="12" fill="#fffdf5" stroke="#cedbd3" stroke-width="1" /><circle cx="60" cy="562" r="16" fill="#197a82" stroke="none" stroke-width="2"/><text x="60" y="569" font-size="19" fill="#fffdf5" font-weight="700" text-anchor="middle">1</text><text x="86" y="569" font-size="22" fill="#233d4b" font-weight="650" text-anchor="start">招式小图</text><text x="55" y="621" font-size="17" fill="#233d4b" font-weight="400" text-anchor="start">显示推距和落点</text><text x="55" y="651" font-size="17" fill="#233d4b" font-weight="400" text-anchor="start">不是读取一个force画箭头</text><path d="M438 483L438 523" fill="none" stroke="#197a82" stroke-width="3" stroke-linecap="round"/><polygon points="438,523 432.58067956842024,511.1834452542265 443.41932043157976,511.1834452542265" fill="#197a82"/><rect x="311" y="533" width="261" height="182" rx="12" fill="#fffdf5" stroke="#cedbd3" stroke-width="1" /><circle cx="337" cy="562" r="16" fill="#197a82" stroke="none" stroke-width="2"/><text x="337" y="569" font-size="19" fill="#fffdf5" font-weight="700" text-anchor="middle">2</text><text x="363" y="569" font-size="22" fill="#233d4b" font-weight="650" text-anchor="start">鼠标预览</text><text x="332" y="621" font-size="17" fill="#233d4b" font-weight="400" text-anchor="start">桥来袭 5 → 2</text><text x="332" y="651" font-size="17" fill="#233d4b" font-weight="400" text-anchor="start">区分本手与敌方阶段</text><path d="M715 483L715 523" fill="none" stroke="#197a82" stroke-width="3" stroke-linecap="round"/><polygon points="715,523 709.5806795684202,511.1834452542265 720.4193204315798,511.1834452542265" fill="#197a82"/><rect x="588" y="533" width="261" height="182" rx="12" fill="#fffdf5" stroke="#cedbd3" stroke-width="1" /><circle cx="614" cy="562" r="16" fill="#197a82" stroke="none" stroke-width="2"/><text x="614" y="569" font-size="19" fill="#fffdf5" font-weight="700" text-anchor="middle">3</text><text x="640" y="569" font-size="22" fill="#233d4b" font-weight="650" text-anchor="start">执行与回看</text><text x="609" y="621" font-size="17" fill="#233d4b" font-weight="400" text-anchor="start">受力 → 滑移 → 停下</text><text x="609" y="651" font-size="17" fill="#233d4b" font-weight="400" text-anchor="start">状态与血条在事件点同步</text><path d="M992 483L992 523" fill="none" stroke="#197a82" stroke-width="3" stroke-linecap="round"/><polygon points="992,523 986.5806795684202,511.1834452542265 997.4193204315798,511.1834452542265" fill="#197a82"/><rect x="865" y="533" width="261" height="182" rx="12" fill="#fffdf5" stroke="#cedbd3" stroke-width="1" /><circle cx="891" cy="562" r="16" fill="#197a82" stroke="none" stroke-width="2"/><text x="891" y="569" font-size="19" fill="#fffdf5" font-weight="700" text-anchor="middle">4</text><text x="917" y="569" font-size="22" fill="#233d4b" font-weight="650" text-anchor="start">任务与结算</text><text x="886" y="621" font-size="17" fill="#233d4b" font-weight="400" text-anchor="start">拆解已停 / 炮仍威胁</text><text x="886" y="651" font-size="17" fill="#233d4b" font-weight="400" text-anchor="start">告诉玩家下一手还缺什么</text><text x="34" y="783" font-size="21" fill="#607682" font-weight="400" text-anchor="start">技能或任务换名字，不影响结果。改变的是数据与局面，不是新增一段特例代码。</text></g></svg>