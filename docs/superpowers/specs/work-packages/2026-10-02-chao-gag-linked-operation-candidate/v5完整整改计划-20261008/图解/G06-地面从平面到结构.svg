b" stroke-width="1" stroke-linejoin="round"/><path d="M764 389L960 471" fill="none" stroke="#233d4b" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" /><path d="M764 389L960 471" fill="none" stroke="#7798a0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M960 475L960 511" fill="none" stroke="#52707b" stroke-width="5" stroke-linecap="round"/><path d="M916 457L916 493" fill="none" stroke="#52707b" stroke-width="5" stroke-linecap="round"/><path d="M872 439L872 475" fill="none" stroke="#52707b" stroke-width="5" stroke-linecap="round"/><path d="M828 421L828 457" fill="none" stroke="#52707b" stroke-width="5" stroke-linecap="round"/><path d="M1036 259L939 349" fill="none" stroke="#197a82" stroke-width="3" stroke-linecap="round"/><polygon points="939,349 943.9762629915189,336.9901371098901 951.3482856997668,344.9355393621129" fill="#197a82"/><text x="1017" y="238" font-size="19" fill="#197a82" font-weight="650" text-anchor="start">板厚</text><path d="M1081 439L940 438" fill="none" stroke="#197a82" stroke-width="3" stroke-linecap="round"/><polygon points="940,438 951.8546915049724,432.6646191024506 951.7778236447914,443.50298738797323" fill="#197a82"/><text x="1030" y="418" font-size="19" fill="#197a82" font-weight="650" text-anchor="start">排水槽</text></g><text x="611" y="544" font-size="21" fill="#607682" font-weight="400" text-anchor="start">厚度与层次，关掉 HUD 仍看得见。</text><circle cx="51" cy="601" r="16" fill="#197a82" stroke="none" stroke-width="2"/><text x="51" y="608" font-size="19" fill="#fffdf5" font-weight="700" text-anchor="middle">1</text><text x="77" y="608" font-size="21" fill="#233d4b" font-weight="650" text-anchor="start">剪影 / 体积</text><text x="34" y="644" font-size="18" fill="#607682" font-weight="400" text-anchor="start">地块边缘、台阶、断裂和悬挑</text><circle cx="422" cy="601" r="16" fill="#197a82" stroke="none" stroke-width="2"/><text x="422" y="608" font-size="19" fill="#fffdf5" font-weight="700" text-anchor="middle">2</text><text x="448" y="608" font-size="21" fill="#233d4b" font-weight="650" text-anchor="start">结构 / 功能</text><text x="405" y="644" font-size="18" fill="#607682" font-weight="400" text-anchor="start">接缝、支座、轨枕、散热和排水</text><circle cx="793" cy="601" r="16" fill="#197a82" stroke="none" stroke-width="2"/><text x="793" y="608" font-size="19" fill="#fffdf5" font-weight="700" text-anchor="middle">3</text><text x="819" y="608" font-size="21" fill="#233d4b" font-weight="650" text-anchor="start">材质 / 痕迹</text><text x="776" y="644" font-size="18" fill="#607682" font-weight="400" text-anchor="start">金属与混凝土差异、受力与磨损</text><text x="34" y="705" font-size="20" fill="#197a82" font-weight="650" text-anchor="start">装饰高低不自动改变通行；可站层、深坑和障碍有独立规则标识。</text></g></svg>