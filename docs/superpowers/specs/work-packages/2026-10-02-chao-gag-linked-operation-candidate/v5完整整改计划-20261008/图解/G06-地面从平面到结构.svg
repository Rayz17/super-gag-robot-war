<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="760" viewBox="0 0 1160 760" role="img" aria-labelledby="title desc"><title id="title">地面要有结构，贴图只负责它擅长的细节</title><desc id="desc">板厚、排水槽、支座和断口用几何；粗糙度、磨损与标线由材质补足。。整改设计示意，非实机截图。</desc><g font-family="PingFang SC,Noto Sans CJK SC,sans-serif"><rect x="0" y="0" width="1160" height="760" rx="18" fill="#f0f0e7" stroke="none" stroke-width="1" /><text x="34" y="47" font-size="30" fill="#233d4b" font-weight="700" text-anchor="start">G06  地面要有结构，贴图只负责它擅长的细节</text><text x="34" y="81" font-size="19" fill="#607682" font-weight="400" text-anchor="start">板厚、排水槽、支座和断口用几何；粗糙度、磨损与标线由材质补足。</text><text x="1126" y="740" font-size="16" fill="#607682" font-weight="400" text-anchor="end">整改设计示意 · 非实机 · 参数为示例</text><rect x="32" y="111" width="526" height="452" rx="12" fill="#fffdf5" stroke="#cedbd3" stroke-width="1" /><circle cx="58" cy="140" r="16" fill="#197a82" stroke="none" stroke-width="2"/><text x="58" y="147" font-size="19" fill="#fffdf5" font-weight="700" text-anchor="middle">1</text><text x="84" y="147" font-size="22" fill="#233d4b" font-weight="650" text-anchor="start">目前的问题：一个平面承担所有层次</text><rect x="580" y="111" width="546" height="452" rx="12" fill="#fffdf5" stroke="#cedbd3" stroke-width="1" /><circle cx="606" cy="140" r="16" fill="#197a82" stroke="none" stroke-width="2"/><text x="606" y="147" font-size="19" fill="#fffdf5" font-weight="700" text-anchor="middle">2</text><text x="632" y="147" font-size="22" fill="#233d4b" font-weight="650" text-anchor="start">改造：从剪影到材质逐层建立</text><polygon points="64,336.68 281,427.82 281,439.82 64,348.68" fill="#9caa9c" stroke="#233d4b" stroke-width="1" stroke-linejoin="round"/><polygon points="435,363.14 281,427.82 281,439.82 435,375.14" fill="#748b88" stroke="#233d4b" stroke-width="1" stroke-linejoin="round"/><polygon points="218,272 435,363.14 281,427.82 64,336.68" fill="#c4c3ad" stroke="#233d4b" stroke-width="1" stroke-linejoin="round"/><path d="M268 293L114 358" fill="none" stroke="#858