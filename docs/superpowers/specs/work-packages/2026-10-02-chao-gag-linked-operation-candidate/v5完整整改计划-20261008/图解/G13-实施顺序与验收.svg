<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="785" viewBox="0 0 1160 785" role="img" aria-labelledby="title desc"><title id="title">施工按完整体验推进，美术和手感从第一步就做</title><desc id="desc">每个阶段横向整合；规则过测不能替代输入体验、画面和声音检查。。整改设计示意，非实机截图。</desc><g font-family="PingFang SC,Noto Sans CJK SC,sans-serif"><rect x="0" y="0" width="1160" height="785" rx="18" fill="#f0f0e7" stroke="none" stroke-width="1" /><text x="34" y="47" font-size="30" fill="#233d4b" font-weight="700" text-anchor="start">G13  施工按完整体验推进，美术和手感从第一步就做</text><text x="34" y="81" font-size="19" fill="#607682" font-weight="400" text-anchor="start">每个阶段横向整合；规则过测不能替代输入体验、画面和声音检查。</text><text x="1126" y="765" font-size="16" fill="#607682" font-weight="400" text-anchor="end">整改设计示意 · 非实机 · 参数为示例</text><rect x="215" y="115" width="164" height="80" rx="8" fill="#197a82" stroke="none" stroke-width="1" /><text x="297" y="143" font-size="19" fill="#fffdf5" font-weight="650" text-anchor="middle">0 · 复现</text><text x="297" y="176" font-size="15" fill="#d6e4df" font-weight="400" text-anchor="middle">版本 / 困难局面</text><rect x="397" y="115" width="164" height="80" rx="8" fill="#197a82" stroke="none" stroke-width="1" /><text x="479" y="143" font-size="19" fill="#fffdf5" font-weight="650" text-anchor="middle">1 · 一手可信</text><text x="479" y="176" font-size="15" fill="#d6e4df" font-weight="400" text-anchor="middle">预演 = 结算</text><rect x="579" y="115" width="164" height="80" rx="8" fill="#197a82" stroke="none" stroke-width="1" /><text x="661" y="143" font-size="19" fill="#fffdf5" font-weight="650" text-anchor="middle">2–3 · 整场 / 三区</text><text x="661" y="176" font-size="15" fill="#d6e4df" font-weight="400" text-anchor="middle">动作 + 多解任务</text><rect x="761" y="115" width="164" height="80" rx="8" fill="#197a82" stroke="none" stroke-width="1" /><text x="843" y="143" font-size="19" fill="#fffdf5" font-weight="650" text-anchor="middle">4–5 · 空间 / 身份</text><text x="843" y="176" font-size="15" fill="#d6e4df" font-weight="400" text-anchor="middle">立体 + 人物组合</text><rect x="943" y="115" width="164" height="80" rx="8" fill="#197a82" stroke="none" stroke-width="1" /><text x="1025" y="143" font-size="19" fill="#fffdf5" font-weight="650" text-anchor="middle">6 · 整体验收</text><text x="1025" y="176" font-size="15" fill="#d6e4df" font-weight="400" text-anchor="middle">三任务 + 首玩</text><text x="34" y="261" font-size="24" fill="#197a82" font-weight="700" text-anchor="start">规则与任务</text><rect x="215" y="231" width="164" height="66" rx="7" fill="#fffdf5" stroke="#197a82" stroke-width="2" /><text x="297" y="270" font-size="15" fill="#233d4b" font-weight="600" text-anchor="middle">留存快照</text><path d="M381 264L394 264" fill="none" stroke="#197a82" stroke-width="2" stroke-linecap="round"/><polygon points="394,264 383.09241100390136,269.00244962915053 383.09241100390136,258.99755037084947" fill="#197a82"/><rect x="397" y="231" width="164" height="66" rx="7" fill="#fffdf5" stroke="#197a82" stroke-width="2" /><text x="479" y="270" font-size="15" fill="#233d4b" font-weight="600" text-anchor="middle">通用效果 / 占地</text><path d="M563 264L576 264" fill="none" stroke="#197a82" stroke-width="2" stroke-linecap="round"/><polygon points="576,264 565.0924110039014,269.00244962915053 565.0924110039014,258.99755037084947" fill="#197a82"/><rect x="579" y="231" width="164" height="66" rx="7" fill="#fffdf5" stroke="#197a82" stroke-width="2" /><text x="661" y="270" font-size="15" fill="#233d4b" font-weight="600" text-anchor="middle">敌种 / 增援 / 链路</text><path d="M745 264L758 264" fill="none" stroke="#197a82" stroke-width="2" stroke-linecap="round"/><polygon points="758,264 747.0924110039014,269.00244962915053 747.0924110039014,258.99755037084947" fill="#197a82"/><rect x="761" y="231" width="164" height="66" rx="7" fill="#fffdf5" stroke="#197a82" stroke-width="2" /><text x="843" y="270" font-size="15" fill="#233d4b" font-weight="600" text-anchor="middle">多层 / 空地 / 人物</text><path d="M927 264L940 264" fill="none" stroke="#197a82" stroke-width="2" s