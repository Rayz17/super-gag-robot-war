<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="845" viewBox="0 0 1160 845" role="img" aria-labelledby="title desc"><title id="title">一台机体的特色从哪里来</title><desc id="desc">同一套规则可以组合不同身体、武器、主体与关系，不把机体ID写成玩法分支。。整改设计示意，非实机截图。</desc><g font-family="PingFang SC,Noto Sans CJK SC,sans-serif"><rect x="0" y="0" width="1160" height="845" rx="18" fill="#f0f0e7" stroke="none" stroke-width="1" /><text x="34" y="47" font-size="30" fill="#233d4b" font-weight="700" text-anchor="start">G15  一台机体的特色从哪里来</text><text x="34" y="81" font-size="19" fill="#607682" font-weight="400" text-anchor="start">同一套规则可以组合不同身体、武器、主体与关系，不把机体ID写成玩法分支。</text><text x="1126" y="825" font-size="16" fill="#607682" font-weight="400" text-anchor="end">整改设计示意 · 非实机 · 参数为示例</text><rect x="34" y="123" width="1092" height="86" rx="9" fill="#fffdf5" stroke="#cedbd3" stroke-width="1" /><circle cx="62" cy="163" r="16" fill="#197a82" stroke="none" stroke-width="2"/><text x="62" y="170" font-size="19" fill="#fffdf5" font-weight="700" text-anchor="middle">1</text><text x="91" y="168" font-size="24" fill="#197a82" font-weight="700" text-anchor="start">身体</text><text x="276" y="161" font-size="21" fill="#233d4b" font-weight="650" text-anchor="start">占地 / 质量 / 净空 / 移动</text><text x="276" y="191" font-size="19" fill="#607682" font-weight="400" text-anchor="start">王者 2×2；过窄桥或降落都不同</text><rect x="34" y="228" width="1092" height="86" rx="9" fill="#fffdf5" stroke="#cedbd3" stroke-width="1" /><circle cx="62" cy="268" r="16" fill="#197a82" stroke="none" stroke-width="2"/><text x="62" y="275" font-size="19" fill="#fffdf5" font-weight="700" text-anchor="middle">2</text><text x="91" y="273" font-size="24" fill="#197a82" font-weight="700" text-anchor="start">装备</text><text x="276" y="266" font-size="21" fill="#233d4b" font-weight="650" text-anchor="start">炮 / 钻 / 盾 / 翼及真实挂点</text><text x="276" y="296" font-size="19" fill="#607682" font-weight="400" text-anchor="start">卸掉外翼，就失去对应飞行资格</text><rect x="34" y="333" width="1092" height="86" rx="9" fill="#fffdf5" stroke="#cedbd3" stroke-width="1" /><circle cx="62" cy="373" r="16" fill="#197a82" stroke="none" stroke-width="2"/><text x="62" y="380" font-size="19" fill="#fffdf5" font-weight="700" text-anchor="middle">3</text><text x="91" y="378" font-size="24" fill="#197a82" font-weight="700" text-anchor="start">动作</text><text x="276" y="371" font-size="21" fill="#233d4b" font-weight="650" text-anchor="start">形状 / 效果 / 费用 / 时刻</text><text x="276" y="401" font-size="19" fill="#607682" font-weight="400" text-anchor="start">双炮封两线；右臂钻强推两格</text><rect x="34" y="438" width="1092" height="86" rx="9" fill="#fffdf5" stroke="#cedbd3" stroke-width="1" /><circle cx="62" cy="478" r="16" fill="#197a82" stroke="none" stroke-width="2"/><text x="62" y="485" font-size="19" fill="#fffdf5" font-weight="700" text-anchor="middle">4</text><text x="91" y="483" font-size="24" fill="#197a82" font-weight="700" text-anchor="start">控制主体</text><text x="276" y="476" font-size="21" fill="#233d4b" font-weight="650" text-anchor="start">驾驶者 / 机魂 / 双主体</text><text x="276" y="506" font-size="19" fill="#607682" font-weight="400" text-anchor="start">社勇是豪司与主体 AI，两者能协商</text><rect x="34" y="543" width="1092" height="86" rx="9" fill="#fffdf5" stroke="#cedbd3" stroke-width="1" /><circle cx="62" cy="583" r="16" fill="#197a82" stroke="none" stroke-width="2"/><text x="62" y="590" font-size="19" fill="#fffdf5" font-weight="700" text-anchor="middle">5</text><text x="91" y="588" font-size="24" fill="#197a82" font-weight="700" text-anchor="start">意愿与关系</text><text x="276" y="581" font-size="21" fill="#233d4b" font-weight="650" text-anchor="start">接受条件 / 援护 / 明确成本</text><text x="276" y="611" font-size="19" fill="#607682" font-weight="400" text-anchor="start">拒绝在提交前；合作不免费刷行动</text><rect x="34" y="648" width="1092" height="86" rx="9" fill="#fffdf5" stroke="#cedbd3" stroke-width="1" /><circle cx="62" cy="688" r="16" fill="#197a82" stroke="none" stroke-width="2"/><text x="62" y="695" font-size="19" fill="#fffdf5" font-weight="700" text-anchor="middle">6</text><text x="91" y="693" font-size="24" fill="#197a82" font-weight="700" text-anchor="start">人物与成长</text><text x="276" y="686" font-size="21" fill="#233d4b" font-weight="650" text-anchor="start">有限指令 / 装载 / 成长来源</text><text x="276" y="716" font-size="19" fill="#607682" font-weight="400" text-anchor="start">保全、救援和战斗都能形成成长</text><text x="34" y="796" font-size="20" fill="#607682" font-weight="400" text-anchor="start">玩家不用同时读六层：战斗只呈现当前选择相关的条件，其余进入整备与悬停详情。</text></g></svg>