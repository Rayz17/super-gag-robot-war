r="start">镜头语言：源头动作 → 沿连接传递 → 目标响应</text><text x="54" y="738" font-size="18" fill="#607682" font-weight="400" text-anchor="start">远区只开短缩略窗；点它才切主视角。玩家拖镜头时不抢控制。</text></g></svg>