<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="800" viewBox="0 0 1160 800" role="img" aria-labelledby="title desc"><title id="title">三个工作面，属于同一座城市</title><desc id="desc">按真实地理关系组织总览：C 装卸站在西，B 桥在中部，撤离口在东；A 位于北侧。。整改设计示意，非实机截图。</desc><g font-family="PingFang SC,Noto Sans CJK SC,sans-serif"><rect x="0" y="0" width="1160" height="800" rx="18" fill="#f0f0e7" stroke="none" stroke-width="1" /><text x="34" y="47" font-size="30" fill="#233d4b" font-weight="700" text-anchor="start">G10  三个工作面，属于同一座城市</text><text x="34" y="81" font-size="19" fill="#607682" font-weight="400" text-anchor="start">按真实地理关系组织总览：C 装卸站在西，B 桥在中部，撤离口在东；A 位于北侧。</text><text x="1126" y="780" font-size="16" fill="#607682" font-weight="400" text-anchor="end">整改设计示意 · 非实机 · 参数为示例</text><path d="M65 593Q92 119 588 148Q1032 176 1094 641" fill="none" stroke="#cbd4c8" stroke-width="30" stroke-linecap="round" stroke-linejoin="round" /><text x="87" y="155" font-size="19" fill="#607682" font-weight="400" text-anchor="start">共同的大柱环 / 远景高架</text><path d="M1089 264L1089 190" fill="none" stroke="#233d4b" stroke-width="3" stroke-linecap="round"/><polygon points="1089,190 1094.4193204315798,201.81655474577352 1083.5806795684202,201.81655474577352" fill="#233d4b"/><text x="1088" y="175" font-size="18" fill="#233d4b" font-weight="650" text-anchor="middle">北</text><polygon points="464,226.46 677,315.91999999999996 677,361.91999999999996 464,272.46000000000004" fill="#728d7b" stroke="#233d4b" stroke-width="1" stroke-linejoin="round"/><polygon points="790,268.46 677,315.91999999999996 677,361.91999999999996 790,314.46" fill="#517377" stroke="#233d4b" stroke-width="1" stroke-linejoin="round"/><polygon points="577,179 790,268.46 677,315.91999999999996 464,226.46" fill="#96ad91" stroke="#233d4b" stroke-width="1" stroke-linejoin="round"/><text x="558" y="276" font-size="25" fill="#233d4b" font-weight="700" text-anchor="start">A 供能前庭</text><polygon points="84,486.65999999999997 300,577.38 300,629.38 84,538.66" fill="#9