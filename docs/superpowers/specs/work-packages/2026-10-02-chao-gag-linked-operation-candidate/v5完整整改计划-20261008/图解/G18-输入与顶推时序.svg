<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="860" viewBox="0 0 1160 860" role="img" aria-labelledby="title desc"><title id="title">选中100ms，顶推650ms：反馈有固定时钟</title><desc id="desc">60Hz；顿帧包含在总时长中；无伤顶推不做伤害白闪。。整改设计示意，非实机截图。</desc><g font-family="PingFang SC,Noto Sans CJK SC,sans-serif"><rect x="0" y="0" width="1160" height="860" rx="18" fill="#f0f0e7" stroke="none" stroke-width="1" /><text x="34" y="47" font-size="30" fill="#233d4b" font-weight="700" text-anchor="start">G18  选中100ms，顶推650ms：反馈有固定时钟</text><text x="34" y="81" font-size="19" fill="#607682" font-weight="400" text-anchor="start">60Hz；顿帧包含在总时长中；无伤顶推不做伤害白闪。</text><text x="1126" y="840" font-size="16" fill="#607682" font-weight="400" text-anchor="end">GW-RESCUE-R1 · 施工示意 · 非实机</text><rect x="34" y="113" width="1092" height="215" rx="12" fill="#fffdf5" stroke="#cedbd3" stroke-width="1" /><circle cx="60" cy="142" r="16" fill="#197a82" stroke="none" stroke-width="2"/><text x="60" y="149" font-size="19" fill="#fffdf5" font-weight="700" text-anchor="middle">1</text><text x="86" y="149" font-size="22" fill="#233d4b" font-weight="650" text-anchor="start">选中机体 · 6帧 / 100ms</text><rect x="62" y="182" width="245" height="113" rx="8" fill="#e4eee6" stroke="#cedbd3" stroke-width="1" /><text x="75" y="213" font-size="20" fill="#233d4b" font-weight="700" text-anchor="start">F0 收到点击</text><text x="75" y="246" font-size="15" fill="#607682" font-weight="400" text-anchor="start">状态版本与对象命中</text><text x="75" y="278" font-size="15" fill="#197a82" font-weight="400" text-anchor="start">脚底与规则根节点不移动</text><rect x="329" y="182" width="245" height="113" rx="8" fill="#e4eee6" stroke="#cedbd3" stroke-width="1" /><text x="342" y="213" font-size="20" fill="#233d4b" font-weight="700" text-anchor="start">F1 选中音</text><text x="342" y="246" font-size="15" fill="#607682" font-weight="400" text-anchor="start">范围开始出现</text><text x="342" y="278" font-size="15" fill="#197a82" font-weight="400" text-anchor="start">脚底与规则根节点不移动</text><rect x="596" y="182" width="245" height="113" rx="8" fill="#e4eee6" stroke="#cedbd3" stroke-width="1" /><text x="609" y="213" font-size="20" fill="#233d4b" font-weight="700" text-anchor="start">F3 接令姿态</text><text x="609" y="246" font-size="15" fill="#607682" font-weight="400" text-anchor="start">躯干+0.015格 / 膝伸2°</text><text x="609" y="278" font-size="15" fill="#197a82" font-weight="400" text-anchor="start">脚底与规则根节点不移动</text><rect x="863" y="182" width="245" height="113" rx="8" fill="#e4eee6" stroke="#cedbd3" stroke-width="1" /><text x="876" y="213" font-size="20" fill="#233d4b" font-weight="700" text-anchor="start">F6 稳定选中</text><text x="876" y="246" font-size="15" fill="#607682" font-weight="400" text-anchor="start">足底圈85%→100%完成</text><text x="876" y="278" font-size="15" fill="#197a82" font-weight="400" text-anchor="start">脚底与规则根节点不移动</text><rect x="34" y="354" width="1092" height="306" rx="12" fill="#fffdf5" stroke="#cedbd3" stroke-width="1" /><circle cx="60" cy="383" r="16" fill="#197a82" stroke="none" stroke-width="2"/><text x="60" y="390" font-size="19" fill="#fffdf5" font-weight="700" text-anchor="middle">2</text><text x="86" y="390" font-size="22" fill="#233d4b" font-weight="650" text-anchor="start">液压顶推 · F0至F39 / 650ms</text><path d="M82.0 416L82.0 560" fill="none" stroke="#cedbd3" stroke-width="1" stroke-linecap="round"/><text x="82.0" y="587" font-size="17" fill="#607682" font-weight="400" text-anchor="middle">F0</text><path d="M311.38461538461536 416L311.38461538461536 560" fill="none" stroke="#cedbd3" stroke-width="1" stroke-linecap="round"/><text x="311.38461538461536" y="587" font-size="17" fill="#607682" font-weight="400" text-anchor="middle">F9</text><path d="M464.3076923076923 416L464.3076923076923 560" fill="none" stroke="#cedbd3" stroke-width="1" stroke-linecap="round"/><text x="464.3076923076923" y="587" font-size="17" fill="#607682" font-weight="400" text-anchor="middle">F15</text><path d="M540.7692307692307 416L540.7692307692307 560" fill="none" stroke="#cedbd3" stroke-width="1" stroke-linecap="round"/><text x="540.7692307692307" y="587" font-size="17" fill="#607682" font-weight="400" text-anchor="middle">F18</text><path d="M770.1538461538462 416L770.1538461538462 560" fill="none" stroke="#cedbd3" stroke-width="1" stroke-linecap="round"/><text x="770.1538461538462" y="587" font-size="17" fill="#607682" font-weight="400" text-anchor="middle">F27</text><path d="M1076.0 416L1076.0 560" fill="none" stroke="#cedbd3" stroke-width="1" stroke-linecap="round"/><text x="1076.0" y="587" font-size="17" fill="#607682" font-weight="400" text-anchor="middle">F39</text><rect x="82.0" y="444" width="226.3846153846154" height="74" rx="3" fill="#197a82" stroke="none" stroke-width="1" /><text x="196.69230769230768" y="488" font-size="14" fill="#fffdf5" font-weight="650" text-anchor="middle">抵近工具</text><rect x="311.38461538461536" y="444" width="149.92307692307693" height="74" rx="3" fill="#d2a253" stroke="none" stroke-width="1" /><text x="387.8461538461538" y="488" font-size="14" fill="#fffdf5" font-weight="650" text-anchor="middle">顶住/冲程</text><rect x="464.3076923076923" y="444" width="73.46153846153847" height="74" rx="3" fill="#cd604b" stroke="none" stroke-width="1" /><text x="502.53846153846155" y="488" font-size="14" fill="#fffdf5" font-weight="650" text-anchor="middle">受力</text><rect x="540.7692307692307" y="444" width="226.3846153846154" height="74" rx="3" fill="#8879ae" stroke="none" stroke-width="1" /><text x="655.4615384615385" y="488" font-size="14" fill="#fffdf5" font-weight="650" text-anchor="middle">推1格</text><rect x="770.1538461538462" y="444" width="302.84615384615387" height="74" rx="3" fill="#197a82" stroke="none" stroke-width="1" /><text x="923.0769230769231" y="488" font-size="14" fill="#fffdf5" font-weight="650" text-anchor="middle">收杆恢复</text><text x="60" y="625" font-size="21" fill="#233d4b" font-weight="650" text-anchor="start">F9工具接触 ｜ F15受力反馈 ｜ F27目标落位 ｜ F39可继续下令</text><rect x="34" y="688" width="1092" height="113" rx="8" fill="#fffdf5" stroke="#cedbd3" stroke-width="1" /><text x="55" y="722" font-size="22" fill="#233d4b" font-weight="400" text-anchor="start">音画/血条与有效接触误差≤1帧；主动作总时长误差≤2帧。</text><text x="55" y="759" font-size="22" fill="#233d4b" font-weight="400" text-anchor="start">只有撞到实体才派生碰撞伤；空地上推1格，不冒“−0”，不放爆炸。</text></g></svg>