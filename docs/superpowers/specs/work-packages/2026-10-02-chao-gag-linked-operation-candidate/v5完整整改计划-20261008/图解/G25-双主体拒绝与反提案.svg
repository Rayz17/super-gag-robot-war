 font-weight="700" text-anchor="middle">啮</text><rect x="340.0" y="270.0" width="36" height="36" rx="0" fill="none" stroke="#cd604b" stroke-width="3" /><rect x="340.0" y="310.0" width="36" height="36" rx="0" fill="none" stroke="#cd604b" stroke-width="3" /><rect x="340.0" y="350.0" width="36" height="36" rx="0" fill="none" stroke="#cd604b" stroke-width="3" /><circle cx="278.0" cy="288.0" r="15" fill="none" stroke="#d2a253" stroke-width="3"/><text x="278.0" y="293.0" font-size="15" fill="#233d4b" font-weight="650" text-anchor="middle">替</text><path d="M278.0 328.0L278.0 288.0" fill="none" stroke="#d2a253" stroke-width="3" stroke-linecap="round"/><polygon points="278.0,288.0 283.41932043157976,299.8165547457735 272.58067956842024,299.8165547457735" fill="#d2a253"/><path d="M293.0 288.0L304.0 288.0" fill="none" stroke="#d2a253" stroke-width="3" stroke-linecap="round"/><polygon points="304.0,288.0 292.1834452542265,293.41932043157976 292.1834452542265,282.58067956842024" fill="#d2a253"/><text x="58" y="549" font-size="18" fill="#233d4b" font-weight="400" text-anchor="start">东向三格：避难所会受 4 伤 → 拒绝</text><text x="58" y="580" font-size="18" fill="#233d4b" font-weight="400" text-anchor="start">替案：移到(5,2)，单拳打(6,2)</text><text x="58" y="611" font-size="18" fill="#233d4b" font-weight="400" text-anchor="start">移 1 · 主行动 1 · 敌 4→2 · 自盾 1</text><rect x="518" y="115" width="608" height="176" rx="8" fill="#fffdf5" stroke="#cedbd3" stroke-width="1" /><text x="536" y="146" font-size="21" fill="#197a82" font-weight="700" text-anchor="start">有人伤害：不能靠“说服一次”越过</text><text x="536" y="180" font-size="17" fill="#233d4b" font-weight="400" text-anchor="start">预览即标出受影响建筑、HP段和拒绝原因。</text><text x="536" y="207" font-size="17" fill="#233d4b" font-weight="400" text-anchor="start">安全替案仍可显示；点它重新进入正常瞄准。</text><text x="536" y="234" font-size="17" fill="#233d4b" font-weight="400" text-anchor="start">普通接受替案不花精神，不生成第二次行动。</text><rect x="518" y="314" width="608" height="176" rx="8" fill="#fffdf5" stroke="#cedbd3" stroke-width="1" /><text x="536" y="345" font-size="21" fill="#197a82" font-weight="700" text-anchor="start">纯财物分歧：有条件才能协商</text><text x="536" y="379" font-size="17" fill="#233d4b" font-weight="400" text-anchor="start">P05另局：空仓、无人员、不是城防计分资产。</text><text x="536" y="406" font-size="17" fill="#233d4b" font-weight="400" text-anchor="start">资产主人许可有效 → 可选择实名承担声誉 −1。</text><text x="536" y="433" font-size="17" fill="#233d4b" font-weight="400" text-anchor="start">“先吵一句”与原命令同时提交，次数才扣。</text><rect x="518" y="513" width="608" height="137" rx="8" fill="#fffdf5" stroke="#cedbd3" stroke-width="1" /><text x="536" y="544" font-size="21" fill="#197a82" font-weight="700" text-anchor="start">同意只绑定这份命令和这份局面</text><text x="536" y="578" font-size="17" fill="#233d4b" font-weight="400" text-anchor="start">snapshot_hash ＋ command_fingerprint</text><text x="536" y="605" font-size="17" fill="#233d4b" font-weight="400" text-anchor="start">途中落点被占：废弃旧预览，重算，不强行执行。</text><rect x="34" y="710" width="252" height="137" rx="8" fill="#fffdf5" stroke="#197a82" stroke-width="2" /><text x="160" y="750" font-size="24" fill="#197a82" font-weight="700" text-anchor="middle">接受</text><text x="160" y="791" font-size="19" fill="#233d4b" font-weight="400" text-anchor="middle">正常动作</text><text x="160" y="824" font-size="16" fill="#607682" font-weight="400" text-anchor="middle">提交前就可见</text><rect x="314" y="710" width="252" height="137" rx="8" fill="#fffdf5" stroke="#d2a253" stroke-width="2" /><text x="440" y="750" font-size="24" fill="#d2a253" font-weight="700" text-anchor="middle">附条件</text><text x="440" y="791" font-size="19" fill="#233d4b" font-weight="400" text-anchor="middle">列出缺项</text><text x="440" y="824" font-size="16" fill="#607682" font-weight="400" text-anchor="middle">提交前就可见</text><rect x="594" y="710" width="252" height="137" rx="8" fill="#fffdf5" stroke="#cd604b" stroke-width="2" /><text x="720" y="750" font-size="24" fill="#cd604b" font-weight="700" text-anchor="middle">拒绝</text><text x="720" y="791" font-size="19" fill="#233d4b" font-weight="400" text-anchor="middle">底线不可越</text><text x="720" y="824" font-size="16" fill="#607682" font-weight="400" text-anchor="middle">提交前就可见</text><rect x="874" y="710" width="252" height="137" rx="8" fill="#fffdf5" stroke="#8879ae" stroke-width="2" /><text x="1000" y="750" font-size="24" fill="#8879ae" font-weight="700" text-anchor="middle">反提案</text><text x="1000" y="791" font-size="19" fill="#233d4b" font-weight="400" text-anchor="middle">新命令重验</text><text x="1000" y="824" font-size="16" fill="#607682" font-weight="400" text-anchor="middle">提交前就可见</text></g></svg>