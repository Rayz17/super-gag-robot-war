<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="720" viewBox="0 0 1260 720"><defs><marker id="arr" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#347c82"/></marker></defs><rect width="1260" height="720" fill="#f4f2ea"/><text x="48" y="54" font-family="PingFang SC,Helvetica,sans-serif" font-size="29" fill="#213c4e" font-weight="700">08 / 断冠：它记住一次真实交棒</text><text x="48" y="92" font-family="PingFang SC,Helvetica,sans-serif" font-size="17" fill="#607581" font-weight="400">2×2身体影响推移和射线；反制只来自已经发生的事件。</text><rect x="48" y="165" width="375" height="300" rx="8" fill="#e0e9e3" stroke="#b7cbc6" stroke-width="2"/><text x="72" y="208" font-family="PingFang SC,Helvetica,sans-serif" font-size="24" fill="#347c82" font-weight="700">R1 · 观察</text><text x="72" y="260" font-family="PingFang SC,Helvetica,sans-serif" font-size="19" fill="#213c4e" font-weight="400">拆侧撑：重量5→3</text><text x="72" y="290" font-family="PingFang SC,Helvetica,sans-serif" font-size="19" fill="#213c4e" font-weight="400">预算二号推东 → 雷翎直射</text><text x="72" y="320" font-family="PingFang SC,Helvetica,sans-serif" font-size="19" fill="#213c4e" font-weight="400">记两条事件，暂不减伤</text><path d="M424,318 L452,318" fill="none" stroke="#347c82" stroke-width="3" marker-end="url(#arr)"/><rect x="455" y="165" width="375" height="300" rx="8" fill="#e0e9e3" stroke="#b7cbc6" stroke-width="2"/><text x="479" y="208" font-family="PingFang SC,Helvetica,sans-serif" font-size="24" fill="#347c82" font-weight="700">R2 · 公布</text><text x="479" y="260" font-family="PingFang SC,Helvetica,sans-serif" font-size="19" fill="#213c4e" font-weight="400">同两台、同方向再交棒</text><text x="479" y="290" font-family="PingFang SC,Helvetica,sans-serif" font-size="19" fill="#213c4e" font-weight="400">护板只挡1伤，一轮一次</text><text x="479" y="320" font-family="PingFang SC,Helvetica,sans-serif" font-size="19" fill="#213c4e" font-weight="400">仍会受推，不是技能免疫</text><path d="M831,318 L859,318" fill="none" stroke="#347c82" stroke-width="3" marker-end="url(#arr)"/><rect x="862" y="165" width="375" height="300" rx="8" fill="#e0e9e3" stroke="#b7cbc6" stroke-width="2"/><text x="886" y="208" font-family="PingFang SC,Helvetica,sans-serif" font-size="24" fill="#347c82" font-weight="700">R3/R4 · 换法</text><text x="886" y="260" font-family="PingFang SC,Helvetica,sans-serif" font-size="19" fill="#213c4e" font-weight="400">绕到下侧，把断冠顶北</text><text x="886" y="290" font-family="PingFang SC,Helvetica,sans-serif" font-size="19" fill="#213c4e" font-weight="400">射线离开维护舱</text><text x="886" y="320" font-family="PingFang SC,Helvetica,sans-serif" font-size="19" fill="#213c4e" font-weight="400">舱4/4，撑过R4完成</text><rect x="48" y="502" width="1180" height="125" rx="8" fill="#efe1c7" stroke="none" stroke-width="2"/><text x="72" y="538" font-family="PingFang SC,Helvetica,sans-serif" font-size="19" fill="#213c4e" font-weight="400">边界：鼠标预演不进入记忆；单机连打不构成交棒；换向后不能暗中改承诺。</text><text x="72" y="568" font-family="PingFang SC,Helvetica,sans-serif" font-size="19" fill="#213c4e" font-weight="400">两格身体只推一格，未必清出整条射线——必须看完整足迹。</text><text x="48" y="687" font-family="PingFang SC,Helvetica,sans-serif" font-size="15" fill="#607581" font-weight="400">GW-RESCUE-R1 · 配置 / 规则图解 · 非游戏美术截图</text></svg>