<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="920" viewBox="0 0 1160 920" role="img" aria-labelledby="title desc"><title id="title">人物卡：熟悉的地图操作，一份能力余额</title><desc id="desc">GW-R1-COMMS · 纪存通讯只是改变工机承诺；不增加第二套选单或行动点。。整改设计示意，非实机截图。</desc><g font-family="PingFang SC,Noto Sans CJK SC,sans-serif"><rect x="0" y="0" width="1160" height="920" rx="18" fill="#f0f0e7" stroke="none" stroke-width="1" /><text x="34" y="47" font-size="30" fill="#233d4b" font-weight="700" text-anchor="start">G24  人物卡：熟悉的地图操作，一份能力余额</text><text x="34" y="81" font-size="19" fill="#607682" font-weight="400" text-anchor="start">GW-R1-COMMS · 纪存通讯只是改变工机承诺；不增加第二套选单或行动点。</text><text x="1126" y="900" font-size="16" fill="#607682" font-weight="400" text-anchor="end">第二轮补强 · 施工示意 · 非实机／未验收</text><rect x="34" y="112" width="302" height="355" rx="8" fill="#fffdf5" stroke="#cedbd3" stroke-width="1" /><text x="52" y="143" font-size="21" fill="#197a82" font-weight="700" text-anchor="start">① 点头像展开指令</text><text x="52" y="177" font-size="17" fill="#233d4b" font-weight="400" text-anchor="start">纪存 · 通讯台在线</text><text x="52" y="204" font-size="17" fill="#233d4b" font-weight="400" text-anchor="start">再听一遍     本战 1 次</text><text x="52" y="231" font-size="17" fill="#233d4b" font-weight="400" text-anchor="start">目标：可回应的工机</text><text x="52" y="258" font-size="17" fill="#233d4b" font-weight="400" text-anchor="start">当前旧工单：继续拆桥</text><text x="52" y="285" font-size="17" fill="#233d4b" font-weight="400" text-anchor="start">工机同意核验后安全停工</text><text x="52" y="312" font-size="17" fill="#233d4b" font-weight="400" text-anchor="start">主行动 0 · 移动 0</text><text x="52" y="339" font-size="17" fill="#233d4b" font-weight="400" text-anchor="start">基础敌意、条件一直免费</text><text x="52" y="366" font-size="17" fill="#233d4b" font-weight="400" text-anchor="start">右键退出：次数仍为 1</text><rect x="360" y="112" width="382" height="355" rx="12" fill="#fffdf5" stroke="#cedbd3" stroke-width="1" /><circle cx="386" cy="141" r="16" fill="#197a82" stroke="none" stroke-width="2"/><text x="386" y="148" font-size="19" fill="#fffdf5" font-weight="700" text-anchor="middle">B</text><text x="412" y="148" font-size="22" fill="#233d4b" font-weight="650" text-anchor="start">② 在地图选同一台工机</text><rect x="383" y="183" width="40" height="40" rx="0" fill="#d9dfd2" stroke="#afc0b8" stroke-width="1" /><rect x="423" y="183" width="40" height="40" rx="0" fill="#d9dfd2" stroke="#afc0b8" stroke-width="1" /><rect x="463" y="183" width="40" height="40" rx="0" fill="#d9dfd2" stroke="#afc0b8" stroke-width="1" /><rect x="503" y="183" width="40" height="40" rx="0" fill="#d9dfd2" stroke="#afc0b8" stroke-width="1" /><rect x="543" y="183" width="40" height="40" rx="0" fill="#d9dfd2" stroke="#afc0b8" stroke-width="1" /><rect x="583" y="183" width="40" height="40" rx="0" fill="#d9dfd2" stroke="#afc0b8" stroke-width="1" /><rect x="623" y="183" width="40" height="40" rx="0" fill="#d9dfd2" stroke="#afc0b8" stroke-width="1" /><rect x="663" y="183" width="40" height="40" rx="0" fill="#d9dfd2" stroke="#afc0b8" stroke-width="1" /><rect x="383" y="223" width="40" height="40" rx="0" fill="#d9dfd2" stroke="#afc0b8" stroke-width="1" /><rect x="423" y="223" width="40" height="40" rx="0" fill="#d9dfd2" stroke="#afc0b8" stroke-width="1" /><rect x="463" y="223" width="40" height="40" rx="0" fill="#d9dfd2" stroke="#afc0b8" stroke-width="1" /><rect x="503" y="223" width="40" height="40" rx="0" fill="#d9dfd2" stroke="#afc0b8" stroke-width="1" /><rect x="543" y="223" width="40" height="40" rx="0" fill="#d9dfd2" stroke="#afc0b8" stroke-width="1" /><rect x="583" y="223" width="40" height="40" rx="0" fill="#d9dfd2" stroke="#afc0b8" stroke-width="1" /><rect x="623" y="223" width="40" height="40" rx="0" fill="#d9dfd2" stroke="#afc0b8" stroke-width="1" /><rect x="663" y="223" width="40" height="40" rx="0" fill="#d9dfd2" stroke="#afc0b8" stroke-width="1" /><rect x="383" y="263" width="40" height="40" rx="0" fill="#d9dfd2" stroke="#afc0b8" stroke-width="1" /><rect x="423" y="263" width="40" height="40" rx="0" fill="#d9dfd2" stroke="#afc0b8" stroke-width="1" /><rect x="463" y="263" width="40" height="40" rx="0" fill="#d9dfd2" stroke="#afc0b8" stroke-width="1" /><rect x="503" y="263" width="40" height="40" rx="0" fill="#d9dfd2" stroke="#afc0b8" stroke-width="1" /><rect x="543" y="263" width="40" height="40" rx="0" fill="#d9dfd2" stroke="#afc0b8" stroke-width="1" /><rect x="583" y="263" width="40" height="40" rx="0" fill="#d9dfd2" stroke="#afc0b8" stroke-width="1" /><rect x="623" y="263" width="40" height="40" rx="0" fill="#d9dfd2" stroke="#afc0b8" stroke-width="1" /><rect x="663" y="263" width="40" height="40" rx="0" fill="#d9dfd2" stroke="#afc0b8" stroke-width="1" /><rect x="383" y="303" width="40" height="40" rx="0" fill="#d9dfd2" stroke="#afc0b8" stroke-width="1" /><rect x="423" y="303" width="40" height="40" rx="0" fill="#d9dfd2" stroke="#afc0b8" stroke-width="1" /><rect x="463" y="303" width="40" height="40" rx="0" fill="#d9dfd2" stroke="#afc0b8" stroke-width="1" /><rect x="503" y="303" width="40" height="40" rx="0" fill="#d9dfd2" stroke="#afc0b8" stroke-width="1" /><rect x="543" y="303" width="40" height="40" rx="0" fill="#d9dfd2" stroke="#afc0b8" stroke-width="1" /><rect x="583" y="303" width="40" height="40" rx="0" fill="#d9dfd2" stroke="#afc0b8" stroke-width="1" /><rect x="623" y="303" width="40" height="40" rx="0" fill="#d9dfd2" stroke="#afc0b8" stroke-width="1" /><rect x="663" y="303" width="40" height="40" rx="0" fill="#d9dfd2" stroke="#afc0b8" stroke-width="1" /><rect x="383" y="343" width="40" height="40" rx="0" fill="#d9dfd2" stroke="#afc0b8" stroke-width="1" /><rect x="423" y="343" width="40" height="40" rx="0" fill="#d9dfd2" stroke="#afc0b8" stroke-width="1" /><rect x="463" y="343" width="40" height="40" rx="0" fill="#d9dfd2" stroke="#afc0b8" stroke-width="1" /><rect x="503" y="343" width="40" height="40" rx="0" fill="#d9dfd2" stroke="#afc0b8" stroke-width="1" /><rect x="543" y="343" width="40" height="40" rx="0" fill="#d9dfd2" stroke="#afc0b8" stroke-width="1" /><rect x="583" y="343" width="40" height="40" rx="0" fill="#d9dfd2" stroke="#afc0b8" stroke-width="1" /><rect x="623" y="343" width="40" height="40" rx="0" fill="#d9dfd2" stroke="#afc0b8" stroke-width="1" /><rect x="663" y="343" width="40" height="40" rx="0" fill="#d9dfd2" stroke="#afc0b8" stroke-width="1" /><rect x="383" y="383" width="40" height="40" rx="0" fill="#d9dfd2" stroke="#afc0b8" stroke-width="1" /><rect x="423" y="383" width="40" height="40" rx="0" fill="#d9dfd2" stroke="#afc0b8" stroke-width="1" /><rect x="463" y="383" width="40" height="40" rx="0" fill="#d9dfd2" stroke="#afc0b8" stroke-width="1" /><rect x="503" y="383" width="40" height="40" rx="0" fill="#d9dfd2" stroke="#afc0b8" stroke-width="1" /><rect x="543" y="383" width="40" height="40" rx="0" fill="#d9dfd2" stroke="#afc0b8" stroke-width="1" /><rect x="583" y="383" width="40" height="40" rx="0" fill="#d9dfd2" stroke="#afc0b8" stroke-width="1" /><rect x="623" y="383" width="40" height="40" rx="0" fill="#d9dfd2" stroke="#afc0b8" stroke-width="1" /><rect x="663" y="383" width="40" height="40" rx="0" fill="#d9dfd2" stroke="#afc0b8" stroke-width="1" /><text x="403.0" y="174" font-size="12" fill="#607682" font-weight="400" text-anchor="middle">0</text><text x="443.0" y="174" font-size="12" fill="#607682" font-weight="400" text-anchor="middle">1</text><text x="483.0" y="174" font-size="12" fill="#607682" font-weight="400" text-anchor="middle">2</text><text x="523.0" y="174" font-size="12" fill="#607682" font-weight="400" text-anchor="middle">3</text><text x="563.0" y="174" font-size="12" fill="#607682" font-weight="400" text-anchor="middle">4</text><text x="603.0" y="174" font-size="12" fill="#607682" font-weight="400" text-anchor="middle">5</text><text x="643.0" y="174" font-size="12" fill="#607682" font-weight="400" text-anchor="middle">6</text><text x="683.0" y="174" font-size="12" fill="#607682" font-weight="400" text-anchor="middle">7</text><text x="372" y="207.0" font-size="12" fill="#607682" font-weight="400" text-anchor="middle">0</text><text x="372" y="247.0" font-size="12" fill="#607682" font-weight="400" text-anchor="middle">1</text><text x="372" y="287.0" font-size="12" fill="#607682" font-weight="400" text-anchor="middle">2</text><text x="372" y="327.0" font-size="12" fill="#607682" font-weight="400" text-anchor="middle">3</text><text x="372" y="367.0" font-size="12" fill="#607682" font-weight="400" text-anchor="middle">4</text><text x="372" y="407.0" font-size="12" fill="#607682" font-weight="400" text-anchor="middle">5</text><rect x="507.5" y="307.5" width="31" height="31" rx="6" fill="#cd604b" stroke="#cd604b" stroke-width="3" /><text x="523.0" y="330.0" font-size="19" fill="#fffdf5" font-weight="700" text-anchor="middle">工</text><rect x="547.5" y="307.5" width="71" height="71" rx="6" fill="#8879ae" stroke="#8879ae" stroke-width="3" /><text x="583.0" y="350.0" font-size="19" fill="#fffdf5" font-weight="700" text-anchor="middle">桥</text><path d="M537.0 323.0L548.0 323.0" fill="none" stroke="#cd604b" stroke-width="3" stroke-linecap="round"/><polygon points="548.0,323.0 536.1834452542265,328.41932043157976 536.1834452542265,317.58067956842024" fill="#cd604b"/><text x="383" y="445" font-size="18" fill="#cd604b" font-weight="650" text-anchor="start">桥来袭：工机 3 ＋ 架设炮 2</text><rect x="768" y="112" width="358" height="355" rx="8" fill="#fffdf5" stroke="#cedbd3" stroke-width="1" /><text x="786" y="143" font-size="21" fill="#197a82" font-weight="700" text-anchor="start">③ 先看到后果，再点目标</text><text x="786" y="177" font-size="17" fill="#233d4b" font-weight="400" text-anchor="start">工机桥伤  3 → 0</text><text x="786" y="204" font-size="17" fill="#233d4b" font-weight="400" text-anchor="start">架设炮桥伤  2 → 2</text><text x="786" y="231" font-size="17" fill="#233d4b" font-weight="400" text-anchor="start">工机不移动，仍占原格</text><text x="786" y="258" font-size="17" fill="#233d4b" font-weight="400" text-anchor="start">只取消这一台的拆桥承诺</text><text x="786" y="285" font-size="17" fill="#233d4b" font-weight="400" text-anchor="start">提交成功：次数 1 → 0</text><text x="786" y="312" font-size="17" fill="#233d4b" font-weight="400" text-anchor="start">没有免费第二次机体行动</text><text x="786" y="339" font-size="17" fill="#233d4b" font-weight="400" text-anchor="start">异形无通讯接口：就地说明</text><text x="786" y="366" font-size="17" fill="#233d4b" font-weight="400" text-anchor="start">无须再点“安排／确认／返回”</text><path d="M339 285L356 285" fill="none" stroke="#d2a253" stroke-width="3" stroke-linecap="round"/><polygon points="356,285 344.1834452542265,290.41932043157976 344.1834452542265,279.58067956842024" fill="#d2a253"/><path d="M746 285L763 285" fill="none" stroke="#d2a253" stroke-width="3" stroke-linecap="round"/><polygon points="763,285 751.1834452542265,290.41932043157976 751.1834452542265,279.58067956842024" fill="#d2a253"/><text x="34" y="526" font-size="25" fill="#233d4b" font-weight="700" text-anchor="start">三个入口共用一个实例，不是三张可各用一次的牌</text><rect x="34" y="553" width="328" height="64" rx="8" fill="#dce9e3" stroke="#197a82" stroke-width="1" /><text x="198" y="593" font-size="21" fill="#233d4b" font-weight="400" text-anchor="middle">人物头像</text><path d="M198 621L580 702" fill="none" stroke="#197a82" stroke-width="3" stroke-linecap="round"/><polygon points="580,702 567.3163274516247,704.8503422049979 569.564586153752,694.2474431406448" fill="#197a82"/><rect x="399" y="553" width="328" height="64" rx="8" fill="#dce9e3" stroke="#197a82" stroke-width="1" /><text x="563" y="593" font-size="21" fill="#233d4b" font-weight="400" text-anchor="middle">通讯双页签</text><path d="M563 621L580 702" fill="none" stroke="#197a82" stroke-width="3" stroke-linecap="round"/><polygon points="580,702 572.2690932419953,691.548536911081 582.8766303415069,689.3222636926649" fill="#197a82"/><rect x="764" y="553" width="328" height="64" rx="8" fill="#dce9e3" stroke="#197a82" stroke-width="1" /><text x="928" y="593" font-size="21" fill="#233d4b" font-weight="400" text-anchor="middle">目标旁快捷入口</text><path d="M928 621L580 702" fill="none" stroke="#197a82" stroke-width="3" stroke-linecap="round"/><polygon points="580,702 590.2803568326434,694.0429739604849 592.7374629905235,704.5994300461917" fill="#197a82"/><rect x="290" y="704" width="580" height="69" rx="8" fill="#e9dcbf" stroke="#d2a253" stroke-width="1" /><text x="580" y="732" font-size="20" fill="#233d4b" font-weight="650" text-anchor="middle">AbilityInstance · run17:纪存:SPIRIT-1</text><text x="580" y="757" font-size="18" fill="#233d4b" font-weight="400" text-anchor="middle">同一个 usage / command_id / 结果回执</text><text x="34" y="823" font-size="17" fill="#233d4b" font-weight="400" text-anchor="start">普通瞄准取消免费；双击只提交一次；新事件使旧预览过期；完整回合重置一并恢复效果与次数。</text><text x="34" y="850" font-size="17" fill="#233d4b" font-weight="400" text-anchor="start">面板上的“人物能力／精神指令”只是筛选入口，基本机体招式不复制精神卡。</text></g></svg>