<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="1040" viewBox="0 0 1160 1040" role="img" aria-labelledby="title desc"><title id="title">冲突按规则裁，动画不能抢先占格</title><desc id="desc">每一根事件完成派生因果后，才处理下一根；不按帧率与数组遍历碰运气。。整改设计示意，非实机截图。</desc><g font-family="PingFang SC,Noto Sans CJK SC,sans-serif"><rect x="0" y="0" width="1160" height="1040" rx="18" fill="#f0f0e7" stroke="none" stroke-width="1" /><text x="34" y="47" font-size="30" fill="#233d4b" font-weight="700" text-anchor="start">G17  冲突按规则裁，动画不能抢先占格</text><text x="34" y="81" font-size="19" fill="#607682" font-weight="400" text-anchor="start">每一根事件完成派生因果后，才处理下一根；不按帧率与数组遍历碰运气。</text><text x="1126" y="1020" font-size="16" fill="#607682" font-weight="400" text-anchor="end">GW-RESCUE-R1 · 施工示意 · 非实机</text><rect x="34" y="112" width="120" height="52" rx="8" fill="#fffdf5" stroke="#cedbd3" stroke-width="1" /><text x="94" y="145" font-size="21" fill="#233d4b" font-weight="650" text-anchor="middle">1 玩家</text><path d="M158 138L169 138" fill="none" stroke="#607682" stroke-width="2" stroke-linecap="round"/><polygon points="169,138 158.0924110039014,143.00244962915053 158.0924110039014,132.99755037084947" fill="#607682"/><rect x="173" y="112" width="120" height="52" rx="8" fill="#fffdf5" stroke="#cedbd3" stroke-width="1" /><text x="233" y="145" font-size="21" fill="#233d4b" font-weight="650" text-anchor="middle">2 敌方</text><path d="M297 138L308 138" fill="none" stroke="#607682" stroke-width="2" stroke-linecap="round"/><polygon points="308,138 297.09241100390136,143.00244962915053 297.09241100390136,132.99755037084947" fill="#607682"/><rect x="312" y="112" width="120" height="52" rx="8" fill="#fffdf5" stroke="#cedbd3" stroke-width="1" /><text x="372" y="145" font-size="21" fill="#233d4b" font-weight="650" text-anchor="middle">3 环境</text><path d="M436 138L447 138" fill="none" stroke="#607682" stroke-width="2" stroke-linecap="round"/><polygon points="447,138 436.09241100390136,143.00244962915053 436.09241100390136,132.99755037084947" fill="#607682"/><rect x="451" y="112" width="120" height="52" rx="8" fill="#fffdf5" stroke="#cedbd3" stroke-width="1" /><text x="511" y="145" font-size="21" fill="#233d4b" font-weight="650" text-anchor="middle">4 工程</text><path d="M575 138L586 138" fill="none" stroke="#607682" stroke-width="2" stroke-linecap="round"/><polygon points="586,138 575.0924110039014,143.00244962915053 575.0924110039014,132.99755037084947" fill="#607682"/><rect x="590" y="112" width="120" height="52" rx="8" fill="#197a82" stroke="#cedbd3" stroke-width="1" /><text x="650" y="145" font-size="21" fill="#fffdf5" font-weight="650" text-anchor="middle">5 抵达</text><path d="M714 138L725 138" fill="none" stroke="#607682" stroke-width="2" stroke-linecap="round"/><polygon points="725,138 714.0924110039014,143.00244962915053 714.0924110039014,132.99755037084947" fill="#607682"/><rect x="729" y="112" width="120" height="52" rx="8" fill="#fffdf5" stroke="#cedbd3" stroke-width="1" /><text x="789" y="145" font-size="21" fill="#233d4b" font-weight="650" text-anchor="middle">6 运输</text><path d="M853 138L864 138" fill="none" stroke="#607682" stroke-width="2" stroke-linecap="round"/><polygon points="864,138 853.0924110039014,143.00244962915053 853.0924110039014,132.99755037084947" fill="#607682"/><rect x="868" y="112" width="120" height="52" rx="8" fill="#fffdf5" stroke="#cedbd3" stroke-width="1" /><text x="928" y="145" font-size="21" fill="#233d4b" font-weight="650" text-anchor="middle">7 增援</text><path d="M992 138L1003 138" fill="none" stroke="#607682" stroke-width="2" stroke-linecap="round"/><polygon points="1003,138 992.0924110039014,143.00244962915053 992.0924110039014,132.99755037084947" fill="#607682"/><rect x="1007" y="112" width="120" height="52" rx="8" fill="#fffdf5" stroke="#cedbd3" stroke-width="1" /><text x="1067" y="145" font-size="21" fill="#233d4b" font-weight="650" text-anchor="middle">8 刷新</text><text x="34" y="205" font-size="19" fill="#233d4b" font-weight="400" text-anchor="start">同一事件内部：取命中前目标集合 → 聚合伤害 → 死亡与结构失效 → 强制位移 → 落位后果。</text><rect x="34" y="253" width="1092" height="205" rx="12" fill="#fffdf5" stroke="#cedbd3" stroke-width="1" /><circle cx="60" cy="282" r="16" fill="#197a82" stroke="none" stroke-width="2"/><text x="60" y="289" font-size="19" fill="#fffdf5" font-weight="700" text-anchor="middle">1</text><text x="86" y="289" font-size="22" fill="#233d4b" font-weight="650" text-anchor="start">01 同批两机争一格</text><rect x="59" y="320" width="35" height="35" rx="0" fill="#d9dfd2" stroke="#afc0b8" stroke-width="1" /><rect x="94" y="320" width="35" height="35" rx="0" fill="#d9dfd2" stroke="#afc0b8" stroke-width="1" /><rect x="129" y="320" width="35" height="35" rx="0" fill="#d9dfd2" stroke="#afc0b8" stroke-width="1" /><rect x="164" y="320" width="35" height="35" rx="0" fill="#d9dfd2" stroke="#afc0b8" stroke-width="1" /><rect x="199" y="320" width="35" height="35" rx="0" fill="#d9dfd2" stroke="#afc0b8" stroke-width="1" /><rect x="59" y="355" width="35" height="35" rx="0" fill="#d9dfd2" stroke="#afc0b8" stroke-width="1" /><rect x="94" y="355" width="35" height="35" rx="0" fill="#d9dfd2" stroke="#afc0b8" stroke-width="1" /><rect x="129" y="355" width="35" height="35" rx="0" fill="#d9dfd2" stroke="#afc0b8" stroke-width="1" /><rect x="164" y="355" width="35" height="35" rx="0" fill="#d9dfd2" stroke="#afc0b8" stroke-width="1" /><rect x="199" y="355" width="35" height="35" rx="0" fill="#d9dfd2" stroke="#afc0b8" stroke-width="1" /><rect x="59" y="390" width="35" height="35" rx="0" fill="#d9dfd2" stroke="#afc0b8" stroke-width="1" /><rect x="94" y="390" width="35" height="35" rx="0" fill="#d9dfd2" stroke="#afc0b8" stroke-width="1" /><rect x="129" y="390" width="35" height="35" rx="0" fill="#d9dfd2" stroke="#afc0b8" stroke-width="1" /><rect x="164" y="390" width="35" height="35" rx="0" fill="#d9dfd2" stroke="#afc0b8" stroke-width="1" /><rect x="199" y="390" width="35" height="35" rx="0" fill="#d9dfd2" stroke="#afc0b8" stroke-width="1" /><rect x="97.0" y="358.0" width="29" height="29" rx="4" fill="#197a82" stroke="#197a82" stroke-width="2" /><text x="111.5" y="377.5" font-size="15" fill="#fffdf5" font-weight="650" text-anchor="middle">A</text><rect x="167.0" y="358.0" width="29" height="29" rx="4" fill="#cd604b" stroke="#cd604b" stroke-width="2" /><text x="181.5" y="377.5" font-size="15" fill="#fffdf5" font-weight="650" text-anchor="middle">B</text><rect x="132.0" y="358.0" width="29" height="29" rx="4" fill="none" stroke="#d2a253" stroke-width="2" stroke-dasharray="5 4"/><text x="146.5" y="377.5" font-size="15" fill="#233d4b" font-weight="650" text-anchor="middle"></text><path d="M111.5 372.5L146.5 372.5" fill="none" stroke="#d2a253" stroke-width="4" stroke-linecap="round"/><polygon points="146.5,372.5 133.7744795045516,378.33619123400894 133.7744795045516,366.66380876599106" fill="#d2a253"/><path d="M181.5 372.5L146.5 372.5" fill="none" stroke="#cd604b" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 4"/><polygon points="146.5,372.5 157.4075889960986,367.49755037084947 157.4075889960986,377.50244962915053" fill="#cd604b"/><text x="285" y="338" font-size="22" fill="#233d4b" font-weight="400" text-anchor="start">A力量4，B力量3：A占目标，B留原位。</text><text x="285" y="376" font-size="22" fill="#233d4b" font-weight="400" text-anchor="start">同力按来源/目标固定生成序号，不掷骰。</text><text x="285" y="414" font-size="22" fill="#233d4b" font-weight="400" text-anchor="start">争格本身不额外扣血；已受攻击伤害保留。</text><rect x="34" y="478" width="1092" height="205" rx="12" fill="#fffdf5" stroke="#cedbd3" stroke-width="1" /><circle cx="60" cy="507" r="16" fill="#197a82" stroke="none" stroke-width="2"/><text x="60" y="514" font-size="19" fill="#fffdf5" font-weight="700" text-anchor="middle">2</text><text x="86" y="514" font-size="22" fill="#233d4b" font-weight="650" text-anchor="start">02 预约遇到倒塌或强推</text><rect x="59" y="545" width="35" height="35" rx="0" fill="#d9dfd2" stroke="#afc0b8" stroke-width="1" /><rect x="94" y="545" width="35" height="35" rx="0" fill="#d9dfd2" stroke="#afc0b8" stroke-width="1" /><rect x="129" y="545" width="35" height="35" rx="0" fill="#d9dfd2" stroke="#afc0b8" stroke-width="1" /><rect x="164" y="545" width="35" height="35" rx="0" fill="#d9dfd2" stroke="#afc0b8" stroke-width="1" /><rect x="199" y="545" width="35" height="35" rx="0" fill="#d9dfd2" stroke="#afc0b8" stroke-width="1" /><rect x="59" y="580" width="35" height="35" rx="0" fill="#d9dfd2" stroke="#afc0b8" stroke-width="1" /><rect x="94" y="580" width="35" height="35" rx="0" fill="#d9dfd2" stroke="#afc0b8" stroke-width="1" /><rect x="129" y="580" width="35" height="35" rx="0" fill="#d9dfd2" stroke="#afc0b8" stroke-width="1" /><rect x="164" y="580" width="35" height="35" rx="0" fill="#d9dfd2" stroke="#afc0b8" stroke-width="1" /><rect x="199" y="580" width="35" height="35" rx="0" fill="#d9dfd2" stroke="#afc0b8" stroke-width="1" /><rect x="59" y="615" width="35" height="35" rx="0" fill="#d9dfd2" stroke="#afc0b8" stroke-width="1" /><rect x="94" y="615" width="35" height="35" rx="0" fill="#d9dfd2" stroke="#afc0b8" stroke-width="1" /><rect x="129" y="615" width="35" height="35" rx="0" fill="#d9dfd2" stroke="#afc0b8" stroke-width="1" /><rect x="164" y="615" width="35" height="35" rx="0" fill="#d9dfd2" stroke="#afc0b8" stroke-width="1" /><rect x="199" y="615" width="35" height="35" rx="0" fill="#d9dfd2" stroke="#afc0b8" stroke-width="1" /><rect x="97.0" y="548.0" width="64" height="64" rx="4" fill="none" stroke="#d2a253" stroke-width="2" stroke-dasharray="5 4"/><text x="129.0" y="585.0" font-size="15" fill="#233d4b" font-weight="650" text-anchor="middle">预约</text><rect x="130.5" y="581.5" width="32" height="32" rx="0" fill="#233d4b" stroke="none" stroke-width="1" /><text x="146.5" y="603.5" font-size="24" fill="#cd604b" font-weight="700" text-anchor="middle">×</text><path d="M181.5 597.5L216.5 597.5" fill="none" stroke="#d2a253" stroke-width="4" stroke-linecap="round"/><polygon points="216.5,597.5 203.7744795045516,603.336191234009 203.7744795045516,591.663808765991" fill="#d2a253"/><text x="285" y="563" font-size="22" fill="#233d4b" font-weight="400" text-anchor="start">炮先打塌主泊位，或已有实体被推入该格。</text><text x="285" y="601" font-size="22" fill="#233d4b" font-weight="400" text-anchor="start">抵达阶段重验：用声明的备用位，否则等待。</text><text x="285" y="639" font-size="22" fill="#233d4b" font-weight="400" text-anchor="start">预约不是一堵墙；不会挤走现在站着的人。</text><rect x="34" y="703" width="1092" height="205" rx="12" fill="#fffdf5" stroke="#cedbd3" stroke-width="1" /><circle cx="60" cy="732" r="16" fill="#197a82" stroke="none" stroke-width="2"/><text x="60" y="739" font-size="19" fill="#fffdf5" font-weight="700" text-anchor="middle">3</text><text x="86" y="739" font-size="22" fill="#233d4b" font-weight="650" text-anchor="start">03 大机不切成四份落位</text><rect x="59" y="770" width="35" height="35" rx="0" fill="#d9dfd2" stroke="#afc0b8" stroke-width="1" /><rect x="94" y="770" width="35" height="35" rx="0" fill="#d9dfd2" stroke="#afc0b8" stroke-width="1" /><rect x="129" y="770" width="35" height="35" rx="0" fill="#d9dfd2" stroke="#afc0b8" stroke-width="1" /><rect x="164" y="770" width="35" height="35" rx="0" fill="#d9dfd2" stroke="#afc0b8" stroke-width="1" /><rect x="199" y="770" width="35" height="35" rx="0" fill="#d9dfd2" stroke="#afc0b8" stroke-width="1" /><rect x="59" y="805" width="35" height="35" rx="0" fill="#d9dfd2" stroke="#afc0b8" stroke-width="1" /><rect x="94" y="805" width="35" height="35" rx="0" fill="#d9dfd2" stroke="#afc0b8" stroke-width="1" /><rect x="129" y="805" width="35" height="35" rx="0" fill="#d9dfd2" stroke="#afc0b8" stroke-width="1" /><rect x="164" y="805" width="35" height="35" rx="0" fill="#d9dfd2" stroke="#afc0b8" stroke-width="1" /><rect x="199" y="805" width="35" height="35" rx="0" fill="#d9dfd2" stroke="#afc0b8" stroke-width="1" /><rect x="59" y="840" width="35" height="35" rx="0" fill="#d9dfd2" stroke="#afc0b8" stroke-width="1" /><rect x="94" y="840" width="35" height="35" rx="0" fill="#d9dfd2" stroke="#afc0b8" stroke-width="1" /><rect x="129" y="840" width="35" height="35" rx="0" fill="#d9dfd2" stroke="#afc0b8" stroke-width="1" /><rect x="164" y="840" width="35" height="35" rx="0" fill="#d9dfd2" stroke="#afc0b8" stroke-width="1" /><rect x="199" y="840" width="35" height="35" rx="0" fill="#d9dfd2" stroke="#afc0b8" stroke-width="1" /><rect x="97.0" y="773.0" width="64" height="64" rx="4" fill="none" stroke="#197a82" stroke-width="2" stroke-dasharray="5 4"/><text x="129.0" y="810.0" font-size="15" fill="#233d4b" font-weight="650" text-anchor="middle">大机</text><rect x="132.0" y="808.0" width="29" height="29" rx="4" fill="#cd604b" stroke="#cd604b" stroke-width="2" /><text x="146.5" y="827.5" font-size="15" fill="#fffdf5" font-weight="650" text-anchor="middle">占</text><text x="285" y="788" font-size="22" fill="#233d4b" font-weight="400" text-anchor="start">2×2四格中有一格占用：整个提案失败。</text><text x="285" y="826" font-size="22" fill="#233d4b" font-weight="400" text-anchor="start">换位只属于明确的交换动作，整体提交。</text><text x="285" y="864" font-size="22" fill="#233d4b" font-weight="400" text-anchor="start">普通同时离开不自动允许互相穿过原位。</text><text x="34" y="977" font-size="20" fill="#197a82" font-weight="650" text-anchor="start">预览必须给出同一个胜出者、同一组停步理由、同一个备用泊位；暂停/快进只改变播放时长。</text></g></svg>