<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="690" viewBox="0 0 1160 690" role="img" aria-labelledby="title desc"><title id="title">行动额度、跨回合准备和动画时长分开</title><desc id="desc">此图解释当前整改采用的逐机回合；移动额度并不与攻击动画秒数相加。。整改设计示意，非实机截图。</desc><g font-family="PingFang SC,Noto Sans CJK SC,sans-serif"><rect x="0" y="0" width="1160" height="690" rx="18" fill="#f0f0e7" stroke="none" stroke-width="1" /><text x="34" y="47" font-size="30" fill="#233d4b" font-weight="700" text-anchor="start">G04  行动额度、跨回合准备和动画时长分开</text><text x="34" y="81" font-size="19" fill="#607682" font-weight="400" text-anchor="start">此图解释当前整改采用的逐机回合；移动额度并不与攻击动画秒数相加。</text><text x="1126" y="670" font-size="16" fill="#607682" font-weight="400" text-anchor="end">整改设计示意 · 非实机 · 参数为示例</text><rect x="245" y="115" width="285" height="46" rx="6" fill="#197a82" stroke="none" stroke-width="1" /><text x="387.5" y="145" font-size="20" fill="#fffdf5" font-weight="650" text-anchor="middle">第 N 回合 · 玩家阶段</text><rect x="545" y="115" width="220" height="46" rx="6" fill="#cd604b" stroke="none" stroke-width="1" /><text x="655.0" y="145" font-size="20" fill="#fffdf5" font-weight="650" text-anchor="middle">敌方与环境</text><rect x="780" y="115" width="340" height="46" rx="6" fill="#197a82" stroke="none" stroke-width="1" /><text x="950.0" y="145" font-size="20" fill="#fffdf5" font-weight="650" text-anchor="middle">第 N+1 回合</text><text x="34" y="217" font-size="23" fill="#233d4b" font-weight="650" text-anchor="start">普通机体</text><text x="34" y="248" font-size="16" fill="#607682" font-weight="400" text-anchor="start">移动与主行动分账</text><text x="34" y="341" font-size="23" fill="#233d4b" font-weight="650" text-anchor="start">蓄力武器</text><text x="34" y="372" font-size="16" fill="#607682" font-weight="400" text-anchor="start">准备与释放各占主行动</text><text x="34" y="468" font-size="23" fill="#233d4b" font-weight="650" text-anchor="start">持续支撑</text><text x="34" y="499" font-size="16" fill="#607682" font-weight="400" text-anchor="start">保持站位，直到明确解除</text><rect x="245" y="190" width="75" height="69" rx="8" fill="#d8e6dd" stroke="#cedbd3" stroke-width="1" /><text x="282.5" y="232" font-size="21" fill="#233d4b" font-weight="600" text-anchor="middle">走 2</text><rect x="330" y="190" width="100" height="69" rx="8" fill="#d8e6dd" stroke="#cedbd3" stroke-width="1" /><text x="380.0" y="232" font-size="21" fill="#233d4b" font-weight="600" text-anchor="middle">出手 ●</text><rect x="440" y="190" width="90" height="69" rx="8" fill="#d8e6dd" stroke="#cedbd3" stroke-width="1" /><text x="485.0" y="232" font-size="21" fill="#233d4b" font-weight="600" text-anchor="middle">再走 3</text><text x="257" y="287" font-size="17" fill="#607682" font-weight="400" text-anchor="start">示例：移动 5 用完；主行动用完</text><rect x="245" y="317" width="285" height="64" rx="8" fill="#ecd6a7" stroke="none" stroke-width="1" /><text x="387" y="355" font-size="22" fill="#233d4b" font-weight="650" text-anchor="middle">准备 ● · 扣物资一次</text><path d="M532 347L775 347" fill="none" stroke="#d2a253" stroke-width="5" stroke-linecap="round" stroke-dasharray="7 5"/><rect x="780" y="317" width="340" height="64" rx="8" fill="#bcd7ce" stroke="none" stroke-width="1" /><text x="950" y="355" font-size="22" fill="#233d4b" font-weight="650" text-anchor="middle">释放 ● · 不重复扣物资</text><rect x="245" y="444" width="285" height="64" rx="8" fill="#d8d0e6" stroke="none" stroke-width="1" /><text x="387" y="483" font-size="20" fill="#233d4b" font-weight="650" text-anchor="middle">开始支撑 ● · 锁定站位</text><path d="M540 478L1110 478" fill="none" stroke="#8879ae" stroke-width="5" stroke-linecap="round"/><polygon points="1110,478 1096.3655137548767,484.25306203643817 1096.3655137548767,471.74693796356183" fill="#8879ae"/><text x="796" y="438" font-size="18" fill="#8879ae" font-weight="650" text-anchor="start">跨阶段持续生效</text><text x="795" y="523" font-size="17" fill="#607682" font-weight="400" text-anchor="start">解除前：预告失去支撑的后果</text><rect x="34" y="572" width="1086" height="62" rx="8" fill="#fffdf5" stroke="#cedbd3" stroke-width="1" /><text x="55" y="610" font-size="21" fill="#197a82" font-weight="650" text-anchor="start">播放 1.2 秒、快进或跳过，只改变观看时长；不改变费用、伤害和最终站位。</text></g></svg>