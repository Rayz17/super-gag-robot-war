="start">柜(4,3)：偏置瓷柱＋穿出柜体的母排</text><text x="560" y="228" font-size="18" fill="#233d4b" font-weight="400" text-anchor="start">槽(6,0/1)：楼板侧壁可见，水面低0.8格高</text><text x="560" y="263" font-size="18" fill="#233d4b" font-weight="400" text-anchor="start">选柜才亮金色插头与通向B的能流</text><text x="560" y="298" font-size="18" fill="#233d4b" font-weight="400" text-anchor="start">啮线体意图锁到避难所轮廓，不只写“攻击”</text><text x="560" y="333" font-size="18" fill="#233d4b" font-weight="400" text-anchor="start">首玩5秒：指出电源、受威胁房屋、推落方向</text><polygon points="65,596 183,554.7 277,587.6 159,628.9" fill="#968dab" stroke="#607986" stroke-width="1" stroke-linejoin="round"/><polygon points="65,596 159,628.9 159,673.9 65,641" fill="#60757d" stroke="#60757d" stroke-width="2" stroke-linejoin="round"/><polygon points="159,628.9 277,587.6 277,632.6 159,673.9" fill="#526e7b" stroke="#526e7b" stroke-width="2" stroke-linejoin="round"/><polygon points="315,509 433,467.7 527,500.59999999999997 409,541.9" fill="#968dab" stroke="#607986" stroke-width="1" stroke-linejoin="round"/><polygon points="315,509 409,541.9 409,586.9 315,554" fill="#60757d" stroke="#60757d" stroke-width="2" stroke-linejoin="round"/><polygon points="409,541.9 527,500.59999999999997 527,545.5999999999999 409,586.9" fill="#526e7b" stroke="#526e7b" stroke-width="2" stroke-linejoin="round"/><polygon points="198,583 316,542 399,573 280,615" fill="#365c78" stroke="#365c78" stroke-width="2" stroke-linejoin="round"/><polygon points="205,596 285,623 382,589 314,566" fill="#69a5b0" stroke="#69a5b0" stroke-width="2" stroke-linejoin="round"/><polygon points="177,582 314,534.05 386,559.25 249,607.2" fill="#c0b5c7" stroke="#607986" stroke-width="1" stroke-linejoin="round"/><polygon points="177,582 249,607.2 249,621.2 177,596" fill="#706b85" stroke="#706b85" stroke-width="2" stroke-linejoin="round"/><polygon points="249,607.2 386,559.25 386,573.25 249,621.2" fill="#706b85" stroke="#706b85" stroke-width="2" stroke-linejoin="round"/><path d="M88 576L158 552" fill="none" stroke="#d8cfba" stroke-width="3" stroke-linecap="round"/><path d="M100 580L170 556" fill="none" stroke="#d8cfba" stroke-width="3" stroke-linecap="round"/><path d="M335 493L405 469" fill="none" stroke="#d8cfba" stroke-width="3" stroke-linecap="round"/><path d="M347 497L417 473" fill="none" stroke="#d8cfba" stroke-width="3" stroke-linecap="round"/><path d="M263 601L263 558" fill="none" stroke="#d2a253" stroke-width="3" stroke-linecap="round"/><polygon points="263,558 268.41932043157976,569.8165547457735 257.58067956842024,569.8165547457735" fill="#d2a253"/><text x="280" y="550" font-size="17" fill="#d2a253" font-weight="650" text-anchor="start">升齐／插销</text><text x="560" y="508" font-size="18" fill="#233d4b" font-weight="400" text-anchor="start">岸H1／渠H0；桥低0.35，轨头错0.25格</text><text x="560" y="543" font-size="18" fill="#233d4b" font-weight="400" text-anchor="start">锁销缩回＝未对齐；裂梁＝受损，不能同图</text><text x="560" y="578" font-size="18" fill="#233d4b" font-weight="400" text-anchor="start">接口(3,4)始终露出，桁架不挡操作点</text><text x="560" y="613" font-size="18" fill="#233d4b" font-weight="400" text-anchor="start">撑桥预览：受力线连接实际支点与桥面</text><text x="560" y="648" font-size="18" fill="#233d4b" font-weight="400" text-anchor="start">首玩：区分没电、没对齐、受损三种阻塞</text><polygon points="65,932 380,821.75 495,862.0 180,972.25" fill="#b46e5b" stroke="#607986" stroke-width="1" stroke-linejoin="round"/><polygon points="65,932 180,972.25 180,1007.25 65,967" fill="#795c5d" stroke="#795c5d" stroke-width="2" stroke-linejoin="round"/><polygon points="180,972.25 495,862.0 495,897.0 180,1007.25" fill="#795c5d" stroke="#795c5d" stroke-width="2" stroke-linejoin="round"/><path d="M112 908L410 804" fill="none" stroke="#607986" stroke-width="7" stroke-linecap="round"/><path d="M137 920L435 816" fill="none" stroke="#607986" stroke-width="7" stroke-linecap="round"/><polygon points="220,865 298,837.7 343,853.45 265,880.75" fill="#7997ac" stroke="#607986" stroke-width="1" stroke-linejoin="round"/><polygon points="220,865 265,880.75 265,929.75 220,914" fill="#416a79" stroke="#416a79" stroke-width="2" stroke-linejoin="round"/><polygon points="265,880.75 343,853.45 343,902.45 265,929.75" fill="#416a79" stroke="#416a79" stroke-width="2" stroke-linejoin="round"/><circle cx="242" cy="840" r="5" fill="none" stroke="#d2a253" stroke-width="3"/><circle cx="266" cy="847" r="5" fill="none" stroke="#d2a253" stroke-width="3"/><polygon points="109,889 176,865.55 211,877.8 144,901.25" fill="#c8bea8" stroke="#607986" stroke-width="1" stroke-linejoin="round"/><polygon points="109,889 144,901.25 144,925.25 109,913" fill="#596f85" stroke="#596f85" stroke-width="2" stroke-linejoin="round"/><polygon points="144,901.25 211,877.8 211,901.8 144,925.25" fill="#596f85" stroke="#596f85" stroke-width="2" stroke-linejoin="round"/><path d="M151 929L394 844" fill="none" stroke="#d2a253" stroke-width="4" stroke-linecap="round"/><polygon points="394,844 383.91511910189513,853.7105703885528 380.0611622896686,842.6927879724228" fill="#d2a253"/><text x="379" y="946" font-size="18" fill="#d2a253" font-weight="700" text-anchor="end">C → B → 出口</text><text x="560" y="822" font-size="18" fill="#233d4b" font-weight="400" text-anchor="start">道床高0.08格；箱(4,3)有底座与真实吊点</text><text x="560" y="857" font-size="18" fill="#233d4b" font-weight="400" text-anchor="start">柜(6,4)是敌炮专线，造型与公共母线不同</text><text x="560" y="892" font-size="18" fill="#233d4b" font-weight="400" text-anchor="start">悬停才显示C柜 → A炮的成对电缆标记</text><text x="560" y="927" font-size="18" fill="#233d4b" font-weight="400" text-anchor="start">列车一直向东；跨区有可见的爬升段</text><text x="560" y="962" font-size="18" fill="#233d4b" font-weight="400" text-anchor="start">首玩：能说清“断专线只取消那2伤”</text></g></svg>