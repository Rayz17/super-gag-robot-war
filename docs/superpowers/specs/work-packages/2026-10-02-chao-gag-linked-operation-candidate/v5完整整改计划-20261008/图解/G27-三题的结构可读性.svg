<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="1090" viewBox="0 0 1160 1090" role="img" aria-labelledby="title desc"><title id="title">关卡美术要让人看懂三道题</title><desc id="desc">局部结构施工剖解；造型、高差、材质与选中叠层各自承担信息，不是最终场景美术稿。。整改设计示意，非实机截图。</desc><g font-family="PingFang SC,Noto Sans CJK SC,sans-serif"><rect x="0" y="0" width="1160" height="1090" rx="18" fill="#f0f0e7" stroke="none" stroke-width="1" /><text x="34" y="47" font-size="30" fill="#233d4b" font-weight="700" text-anchor="start">G27  关卡美术要让人看懂三道题</text><text x="34" y="81" font-size="19" fill="#607682" font-weight="400" text-anchor="start">局部结构施工剖解；造型、高差、材质与选中叠层各自承担信息，不是最终场景美术稿。</text><text x="1126" y="1070" font-size="16" fill="#607682" font-weight="400" text-anchor="end">第二轮补强 · 施工示意 · 非实机／未验收</text><rect x="34" y="115" width="1092" height="292" rx="8" fill="#fffdf5" stroke="#cedbd3" stroke-width="1" /><text x="54" y="150" font-size="23" fill="#197a82" font-weight="700" text-anchor="start">A 供能前庭：粗母排、退入门廊、真深槽</text><rect x="34" y="430" width="1092" height="292" rx="8" fill="#fffdf5" stroke="#cedbd3" stroke-width="1" /><text x="54" y="465" font-size="23" fill="#197a82" font-weight="700" text-anchor="start">B 跨渠桥座：不是一张桥贴图</text><rect x="34" y="745" width="1092" height="292" rx="8" fill="#fffdf5" stroke="#cedbd3" stroke-width="1" /><text x="54" y="780" font-size="23" fill="#197a82" font-weight="700" text-anchor="start">C 装卸站：列车方向与敌炮专线分清</text><polygon points="65,292 275,218.5 395,260.5 185,334.0" fill="#819b8a" stroke="#607986" stroke-width="1" stroke-linejoin="round"/><polygon points="65,292 185,334.0 185,366.0 65,324" fill="#60757d" stroke="#60757d" stroke-width="2" stroke-linejoin="round"/><polygon points="185,334.0 395,260.5 395,292.5 185,366.0" fill="#526e7b" stroke="#526e7b" stroke-width="2" stroke-linejoin="round"/><polygon points="168,232 248,204.0 298,221.5 218,249.5" fill="#9bb5a4" stroke="#607986" stroke-width="1" stroke-linejoin="round"/><polygon points="168,232 218,249.5 218,315.5 168,298" fill="#5