<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="1000" viewBox="0 0 1160 1000" role="img" aria-labelledby="title desc"><title id="title">随机牌组：证明它增加选择，而不是增加点击</title><desc id="desc">P04-DECK-01 · 同编队、同题面、同种子配对；三种模式是实验条件，不是已测结果。。整改设计示意，非实机截图。</desc><g font-family="PingFang SC,Noto Sans CJK SC,sans-serif"><rect x="0" y="0" width="1160" height="1000" rx="18" fill="#f0f0e7" stroke="none" stroke-width="1" /><text x="34" y="47" font-size="30" fill="#233d4b" font-weight="700" text-anchor="start">G28  随机牌组：证明它增加选择，而不是增加点击</text><text x="34" y="81" font-size="19" fill="#607682" font-weight="400" text-anchor="start">P04-DECK-01 · 同编队、同题面、同种子配对；三种模式是实验条件，不是已测结果。</text><text x="1126" y="980" font-size="16" fill="#607682" font-weight="400" text-anchor="end">第二轮补强 · 施工示意 · 非实机／未验收</text><rect x="34" y="121" width="346" height="238" rx="8" fill="#fffdf5" stroke="#197a82" stroke-width="2" /><text x="52" y="157" font-size="23" fill="#197a82" font-weight="700" text-anchor="start">A 确定指令</text><text x="52" y="192" font-size="18" fill="#607682" font-weight="400" text-anchor="start">主版对照</text><text x="52" y="234" font-size="17" fill="#233d4b" font-weight="400" text-anchor="start">基本动作＋人物有限指令</text><text x="52" y="270" font-size="17" fill="#233d4b" font-weight="400" text-anchor="start">没有牌能量或随机手牌</text><text x="52" y="306" font-size="17" fill="#233d4b" font-weight="400" text-anchor="start">证明现有棋盘自己能成立</text><rect x="407" y="121" width="346" height="238" rx="8" fill="#fffdf5" stroke="#d2a253" stroke-width="2" /><text x="425" y="157" font-size="23" fill="#d2a253" font-weight="700" text-anchor="start">A_plus 公开修饰</text><text x="425" y="192" font-size="18" fill="#607682" font-weight="400" text-anchor="start">分辨新工具的价值</text><text x="425" y="234" font-size="17" fill="#233d4b" font-weight="400" text-anchor="start">16种修饰均公开、每轮能量3</text><text x="425" y="270" font-size="17" fill="#233d4b" font-weight="400" text-anchor="start">显示当前动作兼容项</text><text x="425" y="306" font-size="17" fill="#233d4b" font-weight="400" text-anchor="start">不抽牌；工具与B完全相同</text><rect x="780" y="121" width="346" height="238" rx="8" fill="#fffdf5" stroke="#8879ae" stroke-width="2" /><text x="798" y="157" font-size="23" fill="#8879ae" font-weight="700" text-anchor="start">B 随机手牌</text><text x="798" y="192" font-size="18" fill="#607682" font-weight="400" text-anchor="start">检验随机性的额外价值</text><text x="798" y="234" font-size="17" fill="#233d4b" font-weight="400" text-anchor="start">固定16实例 / 抽3 / 能量3</text><text x="798" y="270" font-size="17" fill="#233d4b" font-weight="400" text-anchor="start">每招最多附1张；末轮弃牌</text><text x="798" y="306" font-size="17" fill="#233d4b" font-weight="400" text-anchor="start">基础救援与行动不依赖抽牌</text><text x="34" y="416" font-size="23" fill="#233d4b" font-weight="650" text-anchor="start">12名玩家，2种子×3模式，6局每局3轮；顺序交叉，分两次完成。</text><text x="34" y="454" font-size="18" fill="#607682" font-weight="400" text-anchor="start">种子4101—4106：预演不动真实随机数，读档不刷手牌。双方均有确定人物能力。</text><rect x="34" y="490" width="252" height="135" rx="8" fill="#dfe9e1" stroke="#cedbd3" stroke-width="1" /><text x="160" y="544" font-size="36" fill="#197a82" font-weight="750" text-anchor="middle">≤4</text><text x="160" y="590" font-size="18" fill="#233d4b" font-weight="400" text-anchor="middle">平均额外点击</text><rect x="312" y="490" width="252" height="135" rx="8" fill="#dfe9e1" stroke="#cedbd3" stroke-width="1" /><text x="438" y="544" font-size="36" fill="#197a82" font-weight="750" text-anchor="middle">≤20%</text><text x="438" y="590" font-size="18" fill="#233d4b" font-weight="400" text-anchor="middle">无效牌率</text><rect x="590" y="490" width="252" height="135" rx="8" fill="#dfe9e1" stroke="#cedbd3" stroke-width="1" /><text x="716" y="544" font-size="36" fill="#197a82" font-weight="750" text-anchor="middle">≤1.20×</text><text x="716" y="590" font-size="18" fill="#233d4b" font-weight="400" text-anchor="middle">平均回合时长</text><rect x="868" y="490" width="252" height="135" rx="8" fill="#dfe9e1" stroke="#cedbd3" stroke-width="1" /><text x="994" y="544" font-size="36" fill="#197a82" font-weight="750" text-anchor="middle">≥20%</text><text x="994" y="590" font-size="18" fill="#233d4b" font-weight="400" text-anchor="middle">有效选择增幅</text><rect x="34" y="663" width="529" height="190" rx="8" fill="#fffdf5" stroke="#cedbd3" stroke-width="1" /><text x="52" y="694" font-size="21" fill="#197a82" font-weight="700" text-anchor="start">只有过门槛，才继续投资B</text><text x="52" y="728" font-size="17" fill="#233d4b" font-weight="400" text-anchor="start">必要能力抽不到导致失败：0次</text><text x="52" y="755" font-size="17" fill="#233d4b" font-weight="400" text-anchor="start">预演／执行不一致：0次</text><text x="52" y="782" font-size="17" fill="#233d4b" font-weight="400" text-anchor="start">至少8/12更愿重玩B而非A_plus</text><text x="52" y="809" font-size="17" fill="#233d4b" font-weight="400" text-anchor="start">未通过就搁置，不靠“卡组有标题”结案</text><rect x="591" y="663" width="535" height="190" rx="8" fill="#fffdf5" stroke="#cedbd3" stroke-width="1" /><text x="609" y="694" font-size="21" fill="#197a82" font-weight="700" text-anchor="start">成长另用三关曲线验证</text><text x="609" y="728" font-size="17" fill="#233d4b" font-weight="400" text-anchor="start">XP：4 → 10 → 14；阈值6 / 14</text><text x="609" y="755" font-size="17" fill="#233d4b" font-weight="400" text-anchor="start">救援、设施保护、保全都给贡献</text><text x="609" y="782" font-size="17" fill="#233d4b" font-weight="400" text-anchor="start">credits与reputation分开，有事件去重</text><text x="609" y="809" font-size="17" fill="#233d4b" font-weight="400" text-anchor="start">首关stock不自动叠加成长模块</text><text x="34" y="921" font-size="18" fill="#233d4b" font-weight="600" text-anchor="start">要保留：原始点击与录像、未成功玩家、无效牌、每个种子的结果，以及最后采纳／搁置理由。</text></g></svg>