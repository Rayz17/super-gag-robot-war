<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="720" viewBox="0 0 1260 720"><defs><marker id="arr" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#347c82"/></marker></defs><rect width="1260" height="720" fill="#f4f2ea"/><text x="48" y="54" font-family="PingFang SC,Helvetica,sans-serif" font-size="29" fill="#213c4e" font-weight="700">11 / 空地：看平面，也看能否作用到这一层</text><text x="48" y="92" font-family="PingFang SC,Helvetica,sans-serif" font-size="17" fill="#607581" font-weight="400">同格投影不等于同一个目标；先看弹种，再看落点。</text><rect x="48" y="144" width="530" height="440" rx="8" fill="#dce8e9" stroke="#91afba" stroke-width="2"/><text x="74" y="188" font-family="PingFang SC,Helvetica,sans-serif" font-size="24" fill="#347c82" font-weight="700">层2 / 航空</text><text x="74" y="425" font-family="PingFang SC,Helvetica,sans-serif" font-size="24" fill="#b7803f" font-weight="700">层0 / 地面</text><path d="M120,230 H520 M120,475 H520" stroke="#90a5ac" stroke-width="3"/><path d="M332,258 V449" stroke="#607581" stroke-width="2" stroke-dasharray="7 7"/><path d="M331,196 l38,45 l-38,-12 l-38,12 Z" fill="#bd5a50"/><rect x="309" y="441" width="46" height="48" rx="8" fill="#bd5a50" stroke="none" stroke-width="2"/><text x="377" y="226" font-family="PingFang SC,Helvetica,sans-serif" font-size="17" fill="#bd5a50" font-weight="400">追踪弹：只打这里</text><text x="377" y="474" font-family="PingFang SC,Helvetica,sans-serif" font-size="17" fill="#b7803f" font-weight="400">地爆：只打这里</text><text x="72" y="549" font-family="PingFang SC,Helvetica,sans-serif" font-size="16" fill="#213c4e" font-weight="400">高度标、投影线与层筛选共同表达，不只换颜色。</text><text x="630" y="177" font-family="PingFang SC,Helvetica,sans-serif" font-size="25" fill="#347c82" font-weight="700">燃料B：3 → 2 → 1 → 0</text><text x="630" y="226" font-family="PingFang SC,Helvetica,sans-serif" font-size="20" fill="#213c4e" font-weight="400">每个空中轮末−1；起降各花1移动。</text><text x="630" y="256" font-family="PingFang SC,Helvetica,sans-serif" font-size="20" fill="#213c4e" font-weight="400">燃料1时提前画出迫降候选。</text><text x="630" y="286" font-family="PingFang SC,Helvetica,sans-serif" font-size="20" fill="#213c4e" font-weight="400">距离≤2，完整承重且没有占用。</text><text x="630" y="316" font-family="PingFang SC,Helvetica,sans-serif" font-size="20" fill="#213c4e" font-weight="400">按距离 → y → x选择，不随机。</text><text x="630" y="346" font-family="PingFang SC,Helvetica,sans-serif" font-size="20" fill="#213c4e" font-weight="400">合法迫降受1伤；无落位直接失能。</text><rect x="630" y="438" width="580" height="151" rx="8" fill="#eee0c8" stroke="#b7803f" stroke-width="2"/><text x="651" y="477" font-family="PingFang SC,Helvetica,sans-serif" font-size="19" fill="#213c4e" font-weight="400">A版不计燃料，棋盘和敌人完全相同。</text><text x="651" y="507" font-family="PingFang SC,Helvetica,sans-serif" font-size="19" fill="#213c4e" font-weight="400">主战役不加燃料条。是否值得保留B，</text><text x="651" y="537" font-family="PingFang SC,Helvetica,sans-serif" font-size="19" fill="#213c4e" font-weight="400">要看人的决策与节奏，不靠规则测试代签。</text><text x="48" y="687" font-family="PingFang SC,Helvetica,sans-serif" font-size="15" fill="#607581" font-weight="400">GW-RESCUE-R1 · 配置 / 规则图解 · 非游戏美术截图</text></svg>