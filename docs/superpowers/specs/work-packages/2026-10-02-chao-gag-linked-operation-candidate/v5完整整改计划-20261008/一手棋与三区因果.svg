<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="660" viewBox="0 0 1100 660" role="img" aria-labelledby="title desc">
<title id="title">一手棋怎样改变三个战场</title><desc id="desc">设计示意。选择预算二号并预览推敌，可消除桥的3点设施伤害，架设炮的2点仍需处理。A供电与B桥路共同支持C列车向东撤离。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#197782"/></marker><marker id="danger" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#b74d3b"/></marker><style>text{font-family:PingFang SC,Noto Sans CJK SC,sans-serif;fill:#243742}.h{font-size:26px;font-weight:700}.s{font-size:19px}.m{font-size:22px;font-weight:600}.n{font-size:16px;fill:#586e78}.card{fill:#fffefa;stroke:#c7d6cf;stroke-width:2}</style></defs>
<rect width="1100" height="660" rx="18" fill="#eeeee6"/>
<text x="34" y="47" class="h">先让玩家看懂一手，再让这一手连接整座城</text><text x="870" y="46" class="n">整改设计示意 · 非实机</text>
<rect class="card" x="30" y="78" width="300" height="231" rx="12"/>
<text x="50" y="112" class="m">① 光标放到目标上</text>
<text x="50" y="149" class="s">选中预算二号 → 顶推</text>
<g stroke="#9bafa8" stroke-width="1" fill="#d7e4d9"><path d="M58 177H284V278H58Z"/><path d="M114 177V278M170 177V278M226 177V278M58 211H284M58 245H284"/></g>
<path d="M198 225V194" stroke="#197782" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="177" y="247" width="42" height="27" rx="4" fill="#176b73"/><text x="188" y="268" style="font-size:18px;fill:white">我</text>
<rect x="177" y="214" width="42" height="27" rx="4" fill="#b74d3b"/><text x="188" y="235" style="font-size:18px;fill:white">敌</text>
<rect x="177" y="181" width="42" height="26" rx="4" fill="none" stroke="#197782" stroke-width="2" stroke-dasharray="5 3"/>
<rect x="233" y="214" width="42" height="27" fill="#797d80"/><text x="244" y="235" style="font-size:18px;fill:white">桥</text>
<rect class="card" x="366" y="78" width="323" height="231" rx="12"/>
<text x="386" y="112" class="m">② 先看改变了什么</text>
<text x="386" y="157" class="s">✓ 楔入体失去桥底接触</text>
<text x="386" y="192" class="s">✓ 这条 3 伤害被取消</text>
<text x="386" y="229" class="s">桥预计损失：5 → 2</text>
<text x="386" y="272" style="font-size:19px;fill:#b74d3b">! A 的架设炮仍待处理</text>
<rect class="card" x="725" y="78" width="345" height="231" rx="12"/>
<text x="745" y="112" class="m">③ 点击后，结果演在原处</text>
<text x="745" y="157" class="s">活塞推出 → 敌机移位</text>
<text x="745" y="192" class="s">接触线断开 → 威胁划除</text>
<text x="745" y="229" class="s">桥的血槽预告同步改变</text>
<text x="745" y="272" class="n">不用远处读一整段结算文字</text>
<path d="M334 192H357M693 192H716" stroke="#197782" stroke-width="3" marker-end="url(#arrow)"/>
<text x="35" y="359" class="h">同一个事件，也要在全城关系中看得见</text>
<rect x="389" y="384" width="310" height="79" class="card" rx="10"/><text x="410" y="416" class="m">A · 供能前庭</text><text x="410" y="445" class="n">复位母线；或压制跨区炮</text>
<rect x="35" y="522" width="290" height="83" class="card" rx="10"/><text x="54" y="554" class="m">C · 装卸站 / 列车</text><text x="54" y="585" class="n">需要供电、轨道畅通、桥可通行</text>
<rect x="404" y="522" width="289" height="83" class="card" rx="10"/><text x="424" y="554" class="m">B · 跨渠桥</text><text x="424" y="585" class="n">临时承重 / 永久修复均可过桥</text>
<rect x="780" y="522" width="284" height="83" class="card" rx="10"/><text x="801" y="554" class="m">东侧撤离口</text><text x="801" y="585" class="n">人、车与保全结果一起结算</text>
<path d="M422 465L231 515M566 465V511M330 561H393M699 561H768" fill="none" stroke="#197782" stroke-width="3" marker-end="url(#arrow)"/>
<text x="279" y="478" class="n">供电</text><text x="579" y="497" class="n">抢修供电</text>
<text x="51" y="641" class="n">示例数字只用于说明新表达；设施耐久变化、城市城防损失和市政保全分别计算，不能混成一个“−1”。</text>
</svg>
