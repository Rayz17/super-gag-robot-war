<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101827"/>
      <stop offset="1" stop-color="#071019"/>
    </linearGradient>
    <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#35465c"/>
      <stop offset="1" stop-color="#1b293b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <marker id="arrowHuman" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#67e8f9"/></marker>
    <marker id="arrowMecha" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#fbbf24"/></marker>
    <marker id="arrowCargo" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#a78bfa"/></marker>
    <style>
      .t{font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif;fill:#edf6ff}
      .muted{fill:#9fb0c4}.label{font-size:24px;font-weight:700}.small{font-size:18px}.tiny{font-size:15px}
      .zone{stroke:#6f8298;stroke-width:2}.dash{stroke-dasharray:10 8}
    </style>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <text class="t" x="70" y="72" font-size="38" font-weight="800">万机馆统一剖面问题图 v0.1</text>
  <text class="t muted" x="70" y="108" font-size="19">逻辑层级与流线检查，不是最终外观、尺寸或美术方向</text>

  <g filter="url(#shadow)">
    <path d="M90 205 Q115 145 215 140 H1040 Q1125 142 1185 205 L1240 260 V785 L1185 850 H210 Q115 845 90 785 Z" fill="url(#hull)" stroke="#8ba0b8" stroke-width="4"/>
    <path d="M1238 360 L1320 415 V680 L1238 730 Z" fill="#24364a" stroke="#8ba0b8" stroke-width="4"/>
    <path d="M150 140 L225 90 H475 L535 140" fill="#223348" stroke="#8ba0b8" stroke-width="4"/>
    <path d="M865 140 L935 92 H1095 L1150 158" fill="#223348" stroke="#8ba0b8" stroke-width="4"/>
  </g>

  <rect x="145" y="190" width="1030" height="105" rx="12" fill="#31475a" class="zone"/>
  <text class="t label" x="175" y="230">L3　档案 / 治理 / 远星观测</text>
  <text class="t small muted" x="175" y="265">馆长办公室 · 长档案 · 章节结算 · 信号观察</text>
  <rect x="920" y="207" width="220" height="68" rx="10" fill="#172438" stroke="#7dd3fc"/>
  <text class="t small" x="940" y="235">未定：操舰台位置</text><text class="t tiny muted" x="940" y="259">前厅双用？独立舰桥？</text>

  <rect x="145" y="310" width="1030" height="105" rx="12" fill="#3b4055" class="zone"/>
  <text class="t label" x="175" y="350">L2　环形天桥 / 维修 / 专题展廊</text>
  <text class="t small muted" x="175" y="385">舰桥与撤退战廊 · 飞行天桥 · 同步舱 · AI三法 · 运动角</text>

  <rect x="145" y="430" width="1030" height="180" rx="12" fill="#4c4238" class="zone"/>
  <text class="t label" x="175" y="470">L1　观众层 / 主展厅 / 情感心脏</text>
  <text class="t small muted" x="175" y="505">前厅 · 70×45×24m主厅 · 留言墙 · 模型病院 · 现实机器 · 旧影像</text>
  <g transform="translate(705 450)">
    <circle cx="60" cy="28" r="17" fill="#eab308"/>
    <path d="M42 48 L78 48 L94 108 L76 150 H42 L26 108 Z" fill="#a8b7c8" stroke="#f8d45d" stroke-width="4"/>
    <path d="M34 60 L2 118 M86 60 L118 112 M48 148 L38 168 M70 148 L80 168" stroke="#a8b7c8" stroke-width="15" stroke-linecap="round"/>
    <text class="t tiny" x="-5" y="178">馆守Z 18m比例锚</text>
  </g>
  <rect x="930" y="455" width="205" height="125" rx="10" fill="#2b302d" stroke="#fbbf24"/>
  <text class="t small" x="950" y="485">可见但未闭合</text>
  <text class="t tiny muted" x="950" y="513">开放日人流</text><text class="t tiny muted" x="950" y="537">消防分区</text><text class="t tiny muted" x="950" y="561">展柜与镜头尺度</text>

  <rect x="145" y="625" width="1030" height="125" rx="12" fill="#303d42" class="zone"/>
  <text class="t label" x="175" y="665">B1　机库脊柱 / 移动底盘 / 动力与货运</text>
  <text class="t small muted" x="175" y="700">中型泊位 · 馆守Z重型架 · 货运升降台 · 外锁泊接口</text>
  <rect x="895" y="645" width="240" height="80" rx="10" fill="#1f2d32" stroke="#a78bfa"/>
  <text class="t tiny" x="915" y="674">未定：主转子 / 动力</text><text class="t tiny" x="915" y="700">损管 / 医疗 / 仓储位置</text>

  <rect x="145" y="765" width="1030" height="65" rx="12" fill="#241f38" class="zone dash" stroke="#a78bfa"/>
  <text class="t label" x="175" y="806">B2　残响接口 / 黑匣子 / 0号侧廊（封闭）</text>

  <g>
    <rect x="1175" y="470" width="115" height="105" rx="12" fill="#24384a" stroke="#fbbf24" stroke-width="3"/>
    <text class="t tiny" x="1192" y="500">外锁泊</text><text class="t tiny muted" x="1192" y="526">15–30m</text><text class="t tiny muted" x="1192" y="552">大型机</text>
    <path d="M1290 520 H1345" stroke="#fbbf24" stroke-width="5" marker-end="url(#arrowMecha)"/>
  </g>

  <g fill="none" stroke-linecap="round" stroke-width="5">
    <path d="M250 520 H420 V250 H620" stroke="#67e8f9" marker-end="url(#arrowHuman)"/>
    <path d="M565 685 H880 V525 H920" stroke="#fbbf24" marker-end="url(#arrowMecha)"/>
    <path d="M330 690 H530 V560" stroke="#a78bfa" marker-end="url(#arrowCargo)"/>
  </g>
  <g class="t tiny">
    <text x="240" y="545" fill="#67e8f9">人流 / 避难</text>
    <text x="625" y="678" fill="#fbbf24">机体出击 / 回收</text>
    <text x="335" y="718" fill="#a78bfa">货运 / 重件</text>
  </g>

  <g transform="translate(1360 175)">
    <rect width="190" height="635" rx="18" fill="#111c29" stroke="#44556a" stroke-width="2"/>
    <text class="t label" x="24" y="45">必须补证</text>
    <g class="t small">
      <text x="24" y="90">01 统一外观</text><text x="24" y="126">02 总平 / 剖面</text>
      <text x="24" y="162">03 七类流线</text><text x="24" y="198">04 岗位 / 停止</text>
      <text x="24" y="234">05 泊位占用</text><text x="24" y="270">06 动力 / 损管</text>
      <text x="24" y="306">07 生活房间</text><text x="24" y="342">08 Hub镜头</text>
      <text x="24" y="378">09 状态差分</text><text x="24" y="414">10 资产BOM</text>
    </g>
    <line x1="24" y1="452" x2="166" y2="452" stroke="#44556a"/>
    <text class="t tiny muted" x="24" y="488">蓝：人流</text><text class="t tiny muted" x="24" y="518">黄：机体</text><text class="t tiny muted" x="24" y="548">紫：货运</text>
    <text class="t tiny" x="24" y="590">若流线相交，</text><text class="t tiny" x="24" y="614">必须给门禁、</text><text class="t tiny" x="24" y="638">时窗或替代路。</text>
  </g>

  <text class="t muted" x="70" y="935" font-size="17">当前图只证明“需要被放进同一个物理身体的问题”。真实舰宽、层高、动力位置、留址结构和生活舱必须由GD2工程/视觉方案重新裁决。</text>
  <text class="t muted" x="70" y="968" font-size="15">Candidate · 2026-08-10 · no Canon promotion · no formal asset authorization</text>
</svg>
