<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="388" viewBox="0 0 1080 388" role="img" aria-labelledby="title desc">
  <title id="title">从玩家问题到可推广的完整体验</title>
  <desc id="desc">固定局面与原要求，确定镜头和操作，制作资产并接入现有工程，验证真实输入和连续音画，解决缺陷，再迁移到其他机体与关卡。两次有效修复未改善时改变制作方法。完整原范围始终保留。</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#467b83" stroke-width="1.5"/></marker></defs>
  <rect width="1080" height="388" rx="18" fill="#f1f4f2"/>
  <g font-family="system-ui, PingFang SC, sans-serif" fill="#213641">
    <text x="34" y="38" font-size="21" font-weight="700">一段体验贯穿制作全过程</text>
    <text x="34" y="63" font-size="14">保留完整范围；每次集中解决一个可观察的问题；通过后再推广</text>
    <g fill="#fff" stroke="#bed0d2" stroke-width="1.5">
      <rect x="34" y="88" width="302" height="87" rx="10"/><rect x="389" y="88" width="302" height="87" rx="10"/><rect x="744" y="88" width="302" height="87" rx="10"/>
      <rect x="744" y="226" width="302" height="87" rx="10"/><rect x="389" y="226" width="302" height="87" rx="10"/><rect x="34" y="226" width="302" height="87" rx="10"/>
    </g>
    <g font-size="18" font-weight="650">
      <text x="53" y="117">01　问题与规则</text><text x="408" y="117">02　镜头与操作</text><text x="763" y="117">03　制作与集成</text>
      <text x="763" y="255">04　真实经历</text><text x="408" y="255">05　判断与修正</text><text x="53" y="255">06　迁移与覆盖</text>
    </g>
    <g font-size="14" fill="#4b6069">
      <text x="53" y="145">同一初态 · 原规格 · 选择与后果</text><text x="408" y="145">默认视图 · 灰模构图 · 光标分镜</text><text x="763" y="145">源资产 · 能力与效果 · 统一事件</text>
      <text x="763" y="283">原生输入 · 连续音画 · 实际性能</text><text x="408" y="283">看懂什么 · 操作代价 · 剩余缺陷</text><text x="53" y="283">另一对象/关卡 · 回到全部原条目</text>
    </g>
    <text x="34" y="356" font-size="14">结构检查、体验质量、用户认可分别记录；模板、数字与文件数量不代替实际效果</text>
  </g>
  <g fill="none" stroke="#467b83" stroke-width="2" marker-end="url(#arrow)">
    <path d="M340 131 H382"/><path d="M695 131 H737"/><path d="M895 180 V218"/><path d="M738 270 H700"/><path d="M383 270 H344"/>
    <path d="M540 220 V181" stroke-dasharray="5 4"/>
  </g>
  <text x="558" y="206" font-family="system-ui, PingFang SC, sans-serif" font-size="12" fill="#835e3f">未改善：定位原因 / 换制作方法</text>
</svg>
