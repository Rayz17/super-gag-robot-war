  <!-- Pivot and facing cues remain separate from anatomy. -->
  <g stroke="#ff4f79" fill="none" stroke-width="1.5">
    <line x1="120" y1="224" x2="136" y2="224"/>
    <line x1="128" y1="216" x2="128" y2="232"/>
    <circle cx="128" cy="224" r="3"/>
  </g>
  <text x="137" y="228" fill="#ff7c9a" font-family="Arial, sans-serif" font-size="4.5">PIVOT [128,224]</text>

  <g stroke="#ffbf47" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
