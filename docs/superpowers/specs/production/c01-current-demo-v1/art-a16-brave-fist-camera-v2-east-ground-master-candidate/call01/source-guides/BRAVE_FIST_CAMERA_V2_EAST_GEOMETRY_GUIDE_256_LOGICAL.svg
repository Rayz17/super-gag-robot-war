    <polygon points="132,151 145,143 157,150 144,158" fill="#cbd4da"/>
    <polygon points="132,151 144,158 142,194 130,187" fill="#9eabb4"/>
    <polygon points="144,158 157,150 155,186 142,194" fill="#df6e3e"/>
    <polygon points="130,188 142,195 140,216 128,209" fill="#97a5ae"/>
    <polygon points="142,195 155,187 153,208 140,216" fill="#e67340"/>
    <polygon points="128,209 140,216 158,216 145,209" fill="#d3dbe0"/>
    <polygon points="140,216 158,216 158,220 140,224" fill="#eb7440"/>

    <!-- Near leg, slightly advanced along east axis; its sole reaches the pivot. -->
    <polygon points="108,149 121,142 134,149 121,157" fill="#cfd7dc"/>
    <polygon points="108,149 121,157 117,193 105,186" fill="#9ba8b1"/>
    <polygon points="121,157 134,149 130,185 117,193" fill="#e2713f"/>
    <polygon points="104,187 117,194 113,216 101,209" fill="#96a4ad"/>
    <polygon points="117,194 130,186 126,208 113,216" fill="#e67340"/>
    <polygon points="101,209 113,216 133,216 120,209" fill="#d3dbe0"/>
    <polygon points="113,216 133,216 128,224 108,224" fill="#ed7541"/>
