    <polyline points="213,210 224,213 220,202"/>
  </g>
  <text x="182" y="181" fill="#ffcf72" font-family="Arial, sans-serif" font-size="5.2" font-weight="700">EAST [40,24]</text>

  <g stroke="#82a2ff" fill="none" stroke-width="1.3" stroke-linecap="round">
    <line x1="18" y1="210" x2="18" y2="54"/>
    <polyline points="14,60 18,54 22,60"/>
  </g>
  <text x="23" y="60" fill="#9bb5ff" font-family="Arial, sans-serif" font-size="4.5">ELEVATED ORTHOGRAPHIC</text>
  <text x="23" y="67" fill="#9bb5ff" font-family="Arial, sans-serif" font-size="4.5">TOP PLANES VISIBLE</text>

  <rect x="10" y="238" width="236" height="10" rx="2" fill="#202b34"/>
  <text x="128" y="245" text-anchor="middle" fill="#dce5ea" font-family="Arial, sans-serif" font-size="4.5">POSE / CAMERA / FOOTPOINT ONLY · DO NOT COPY BLOCK ANATOMY OR COLORS</text>
</svg>
