    <polygon points="121,68 130,63 139,68 130,74" fill="#cbd4da"/>
    <polygon points="98,77 128,59 160,78 130,96" fill="#dbe2e6"/>
    <polygon points="98,77 130,96 130,128 98,109" fill="#aeb9c1"/>
    <polygon points="130,96 160,78 160,110 130,128" fill="#ef7641"/>
    <polyline points="98,77 128,59 160,78" fill="none" stroke="#2aa4c0" stroke-width="1.5"/>

