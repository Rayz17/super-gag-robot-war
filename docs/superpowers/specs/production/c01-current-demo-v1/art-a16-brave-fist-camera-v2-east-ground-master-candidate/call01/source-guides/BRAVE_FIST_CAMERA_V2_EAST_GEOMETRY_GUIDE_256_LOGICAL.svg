    <polygon points="162,86 174,79 171,119 160,126" fill="#e0703f"/>
    <polygon points="151,79 162,86 160,126 150,120" fill="#9faeb7"/>
    <polygon points="158,123 170,116 180,123 168,130" fill="#d0d8dd"/>
    <polygon points="158,123 168,130 165,149 155,143" fill="#9ba8b1"/>
    <polygon points="168,130 180,123 177,142 165,149" fill="#ec7440"/>

    <!-- Near arm, clearly forward/down but not crossing the torso. -->
    <polygon points="89,82 101,75 112,82 100,89" fill="#d3dbe0"/>
    <polygon points="89,82 100,89 96,130 85,124" fill="#9daab3"/>
    <polygon points="100,89 112,82 108,123 96,130" fill="#e57240"/>
    <polygon points="82,126 96,118 108,125 94,133" fill="#d0d8dd"/>
    <polygon points="82,126 94,133 91,151 79,144" fill="#9ba8b1"/>
    <polygon points="94,133 108,125 105,143 91,151" fill="#ed7541"/>

