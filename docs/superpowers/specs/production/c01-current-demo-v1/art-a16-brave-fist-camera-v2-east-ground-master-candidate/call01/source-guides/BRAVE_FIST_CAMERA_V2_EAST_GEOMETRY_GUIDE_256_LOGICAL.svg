<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 256 256">
  <rect width="256" height="256" fill="#0e141b"/>
  <rect x="1" y="1" width="254" height="254" fill="none" stroke="#667c8b" stroke-width="1"/>
  <rect x="10" y="10" width="236" height="214" fill="none" stroke="#465e6d" stroke-width="0.75" stroke-dasharray="4 4"/>

  <text x="12" y="20" fill="#d8e2e8" font-family="Arial, sans-serif" font-size="7" font-weight="700">CAMERA V2 EAST — GEOMETRY ONLY</text>
  <text x="12" y="28" fill="#8597a5" font-family="Arial, sans-serif" font-size="4.2">256 LOGICAL · 2×2 · PIVOT [128,224] · NO IDENTITY</text>

