<svg xmlns="http://www.w3.org/2000/svg" width="862" height="1825" viewBox="0 0 862 1825">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#171a1f"/>
      <stop offset="1" stop-color="#090b0e"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#767d86"/>
      <stop offset="1" stop-color="#343941"/>
    </linearGradient>
    <linearGradient id="arm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e79a2c"/>
      <stop offset="1" stop-color="#8b4814"/>
    </linearGradient>
    <linearGradient id="pressure" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d9f8ff" stop-opacity="0.95"/>
      <stop offset="0.58" stop-color="#74d7e8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#d8a84b" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-50%" width="160%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="862" height="1825" fill="url(#bg)"/>
  <rect x="14" y="14" width="834" height="1797" rx="18" fill="none" stroke="#565d66" stroke-width="2"/>

  <!-- anonymous head/torso mass: forward lean, no identity details -->
  <g stroke="#090b0e" stroke-width="10" stroke-linejoin="round">
    <path d="M390 223 L472 223 L496 292 L464 344 L397 344 L366 292 Z" fill="url(#body)"/>
    <path d="M257 344 L431 305 L605 344 L660 562 L554 711 L431 754 L307 711 L201 562 Z" fill="url(#body)"/>
    <path d="M313 713 L549 713 L586 930 L528 1084 L334 1084 L276 930 Z" fill="#2d3239"/>
  </g>

  <!-- shoulders and upper arms remain visible behind both elbows -->
  <g stroke="#090b0e" stroke-width="10" stroke-linejoin="round">
    <path d="M210 365 L91 438 L112 631 L239 615 L297 448 Z" fill="url(#arm)"/>
    <path d="M652 365 L771 438 L750 631 L623 615 L565 448 Z" fill="url(#arm)"/>
    <path d="M205 576 L118 680 L161 835 L294 771 L324 621 Z" fill="#545b64"/>
    <path d="M657 576 L744 680 L701 835 L568 771 L538 621 Z" fill="#545b64"/>
    <circle cx="249" cy="739" r="57" fill="#171b20" stroke="#d79029" stroke-width="18"/>
    <circle cx="613" cy="739" r="57" fill="#171b20" stroke="#d79029" stroke-width="18"/>
  </g>

  <!-- clearly continuous forearms: elbow -> rear rail -> sleeve -> fist -->
  <g stroke="#090b0e" stroke-width="10" stroke-linejoin="round">
    <path d="M264 739 L174 846 L136 1102 L268 1176 L387 1062 L363 827 Z" fill="url(#arm)"/>
    <path d="M598 739 L688 846 L726 1102 L594 1176 L475 1062 L499 827 Z" fill="url(#arm)"/>
    <path d="M242 795 L199 878 L180 1038" fill="none" stroke="#74d7e8" stroke-width="20"/>
    <path d="M620 795 L663 878 L682 1038" fill="none" stroke="#74d7e8" stroke-width="20"/>
    <path d="M290 810 L244 900 L226 1053" fill="none" stroke="#d8a84b" stroke-width="13"/>
    <path d="M572 810 L618 900 L636 1053" fill="none" stroke="#d8a84b" stroke-width="13"/>
    <path d="M184 976 L349 953 L375 1080 L195 1121 Z" fill="#59616b"/>
    <path d="M678 976 L513 953 L487 1080 L667 1121 Z" fill="#59616b"/>
  </g>

  <!-- closed blunt fists, visibly attached and only a short stroke ahead of sleeves -->
  <g stroke="#090b0e" stroke-width="10" stroke-linejoin="round">
    <path d="M126 1055 L296 1015 L405 1104 L381 1278 L239 1346 L99 1263 L78 1131 Z" fill="#24292f"/>
    <path d="M736 1055 L566 1015 L457 1104 L481 1278 L623 1346 L763 1263 L784 1131 Z" fill="#24292f"/>
    <path d="M113 1113 L224 1080 L242 1160 L124 1194 Z" fill="#4c535c"/>
    <path d="M241 1076 L348 1121 L329 1204 L234 1160 Z" fill="#4c535c"/>
    <path d="M749 1113 L638 1080 L620 1160 L738 1194 Z" fill="#4c535c"/>
    <path d="M621 1076 L514 1121 L533 1204 L628 1160 Z" fill="#4c535c"/>
  </g>

  <!-- shallow contact-compression layers: flat, short, outside the fist faces only -->
  <g filter="url(#glow)">
    <path d="M68 1090 L92 1096 L90 1272 L66 1279 L42 1255 L42 1113 Z" fill="url(#pressure)" stroke="#d9f8ff" stroke-width="3"/>
    <path d="M794 1090 L770 1096 L772 1272 L796 1279 L820 1255 L820 1113 Z" fill="url(#pressure)" stroke="#d9f8ff" stroke-width="3"/>
  </g>

  <!-- anchored pelvis and legs, braced for a two-fist power stroke -->
  <g stroke="#090b0e" stroke-width="10" stroke-linejoin="round">
    <path d="M333 1035 L431 1081 L529 1035 L565 1202 L504 1288 L358 1288 L297 1202 Z" fill="url(#body)"/>
    <path d="M353 1240 L428 1281 L399 1530 L260 1539 L270 1328 Z" fill="#4b5159"/>
    <path d="M509 1240 L434 1281 L463 1530 L602 1539 L592 1328 Z" fill="#4b5159"/>
    <path d="M251 1507 L400 1507 L402 1704 L181 1733 L150 1654 Z" fill="url(#body)"/>
    <path d="M611 1507 L462 1507 L460 1704 L681 1733 L712 1654 Z" fill="url(#body)"/>
  </g>

  <!-- geometry gate labels -->
  <g font-family="Arial, Helvetica, sans-serif" fill="#d8dde3">
    <text x="42" y="72" font-size="26" font-weight="700">STATE03 RELEASE — ANONYMOUS GEOMETRY GATE</text>
    <text x="42" y="108" font-size="18" fill="#8fdced">both chains visible: shoulder → upper arm → elbow → forearm rails → closed fist</text>
    <text x="42" y="142" font-size="18" fill="#e8b657">short power stroke; shallow contact layer only; no projectile / beam / shield</text>
    <text x="431" y="1780" text-anchor="middle" font-size="18" fill="#9ca5ae">50% must retain both elbow and fist-to-forearm continuity</text>
  </g>
</svg>
