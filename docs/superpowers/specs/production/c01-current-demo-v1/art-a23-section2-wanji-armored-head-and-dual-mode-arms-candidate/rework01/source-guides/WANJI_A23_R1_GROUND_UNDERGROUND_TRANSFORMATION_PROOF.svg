  <rect width="2400" height="1600" fill="url(#bg)"/>
  <text x="70" y="68" class="title">A23-R1｜结构纠偏证明：地上是馆冠，地下才是巨物身体</text>
  <text x="70" y="105" class="subtitle">NOT FINAL ART · 固定馆切面 → 低矮巡展舰 → 未来巨型人形 · 同色即同一物理构件</text>

