    <path d="M514 82 L795 133 L804 170 L513 116 Z" fill="#8e3e38" class="ol"/>
    <circle cx="162" cy="126" r="15" fill="#202c35" class="thin"/><circle cx="790" cy="151" r="15" fill="#202c35" class="thin"/>
    <!-- CIWS arc -->
    <g fill="#c8d2d4" stroke="#25323b" stroke-width="5">
      <path d="M228 122 l20 -27 22 25 -5 28 -32 1z"/><path d="M650 111 l20 -25 22 26 -6 28 -32 0z"/>
    </g>
    <!-- anchor pods -->
    <path d="M160 345 l54 -10 20 38 -45 32 -42 -22z" fill="#bf8c39" class="thin"/>
    <path d="M685 335 l54 10 13 39 -47 22 -38 -32z" fill="#bf8c39" class="thin"/>
    <!-- propulsion spine -->
    <g fill="#45b9d2" stroke="#19323d" stroke-width="6"><ellipse cx="282" cy="407" rx="37" ry="18"/><ellipse cx="470" cy="418" rx="42" ry="19"/><ellipse cx="659" cy="398" rx="37" ry="18"/></g>
    <text x="88" y="485" class="small">宽低馆体 + 巨大 B1/B2；警戒态窗带被装甲百叶覆盖</text>
    <text x="88" y="520" class="tiny">红：双服务梁／未来挂点　蓝灰：舰首盾甲　金：救援锚　青：推进脊</text>
  </g>

  <!-- RIGHT: humanoid fortress -->
  <g transform="translate(1140 165)">
    <text x="85" y="10" class="label">未来人形战斗态  HUMANOID COMBAT</text>
    <!-- backpack and shoulder service booms -->
