<svg xmlns="http://www.w3.org/2000/svg" width="2048" height="1280" viewBox="0 0 2048 1280">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef1f2"/>
      <stop offset="1" stop-color="#d9dee1"/>
    </linearGradient>
    <linearGradient id="armor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f0e7"/>
      <stop offset="1" stop-color="#bfc8ca"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34404a"/>
      <stop offset="1" stop-color="#17222b"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#b4473d"/>
    </marker>
    <style>
      .ol{stroke:#18242d;stroke-width:9;stroke-linejoin:round;stroke-linecap:round}
      .thin{stroke:#40515d;stroke-width:5;stroke-linejoin:round;stroke-linecap:round}
      .map{fill:none;stroke:#b4473d;stroke-width:7;stroke-dasharray:16 12;marker-end:url(#arrow)}
      .label{font-family:Arial,'PingFang SC',sans-serif;font-size:28px;font-weight:700;fill:#192733}
      .small{font-family:Arial,'PingFang SC',sans-serif;font-size:22px;font-weight:600;fill:#334653}
      .tiny{font-family:Arial,'PingFang SC',sans-serif;font-size:18px;font-weight:600;fill:#41535e}
    </style>
  </defs>

  <rect width="2048" height="1280" fill="url(#bg)"/>
  <text x="70" y="70" class="label" font-size="38">A23｜无身份结构 Guide：有头无脸 / 玻璃闭合 / 双形态同源武装</text>
  <text x="70" y="108" class="small">NOT FINAL ART · 不含任何现有 IP 的具体部件、轮廓、色分或变形步骤</text>

