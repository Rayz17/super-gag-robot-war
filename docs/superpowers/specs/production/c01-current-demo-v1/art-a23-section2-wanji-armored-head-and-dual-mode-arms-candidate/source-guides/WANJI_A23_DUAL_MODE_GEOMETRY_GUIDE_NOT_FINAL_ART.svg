    <path d="M268 568 L350 574 L342 835 L263 1030 L158 1024 L180 780 Z" fill="url(#armor)" class="ol"/>
    <path d="M442 568 L360 574 L368 835 L447 1030 L552 1024 L530 780 Z" fill="url(#armor)" class="ol"/>
    <path d="M184 787 L286 792 L262 977 L176 973 Z" fill="#263741" class="thin"/>
    <path d="M526 787 L424 792 L448 977 L534 973 Z" fill="#263741" class="thin"/>
