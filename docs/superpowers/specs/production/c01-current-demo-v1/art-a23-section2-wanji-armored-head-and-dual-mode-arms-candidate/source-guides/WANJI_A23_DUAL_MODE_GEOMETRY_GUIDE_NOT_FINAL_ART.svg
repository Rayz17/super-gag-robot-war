    <path d="M553 1006 L440 1006 L395 1070 L433 1118 L590 1118 L624 1075 Z" fill="#293943" class="ol"/>
    <g fill="#47bfd6" stroke="#19323d" stroke-width="6"><rect x="135" y="1070" width="52" height="18" rx="7"/><rect x="207" y="1070" width="52" height="18" rx="7"/><rect x="451" y="1070" width="52" height="18" rx="7"/><rect x="523" y="1070" width="52" height="18" rx="7"/></g>
  </g>

  <!-- mapping arrows and notes -->
  <path class="map" d="M595 198 C850 110 1030 140 1430 245"/>
  <text x="796" y="125" class="small">装甲指挥核升起并进入旋转颈座</text>
  <path class="map" d="M315 365 C740 580 1030 515 1260 470"/>
  <text x="670" y="590" class="small">舰首盾甲 → 双前臂盾甲</text>
  <path class="map" d="M650 320 C850 300 1030 250 1290 270"/>
  <text x="825" y="280" class="small">服务梁 → 肩背支援炮梁</text>
  <path class="map" d="M470 575 C770 830 1010 975 1325 1120"/>
  <text x="755" y="920" class="small">推进脊 → 背／骨盆／腿／足底</text>

  <g transform="translate(65 1165)">
    <rect width="1918" height="78" rx="20" fill="#ffffff" opacity=".72"/>
    <text x="24" y="31" class="small">硬门：头部清楚但无五官｜人形正面无大面积外露玻璃｜两形态都能追认近防、锚、盾甲、推进和服务梁</text>
    <text x="24" y="61" class="tiny">禁止：A21 无头馆桥塔、A16 类人脸、游艇舰桥、透明胸腿、凭空长炮、普通英雄机比例、现有 IP 轮廓拼贴</text>
  </g>
</svg>
