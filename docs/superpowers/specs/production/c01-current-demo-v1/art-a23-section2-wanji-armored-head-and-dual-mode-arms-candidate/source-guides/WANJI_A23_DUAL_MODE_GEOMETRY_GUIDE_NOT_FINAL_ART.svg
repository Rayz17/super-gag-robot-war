    <!-- protected command/head capsule nested in ship -->
    <path d="M445 20 L494 -20 L562 0 L575 60 L526 82 L462 65 Z" fill="#24313b" class="ol"/>
    <path d="M482 8 L539 16 L546 44 L512 58 L475 43 Z" fill="#aeb7b9" class="thin"/>
    <rect x="512" y="22" width="20" height="8" rx="3" fill="#56d4e6"/>
