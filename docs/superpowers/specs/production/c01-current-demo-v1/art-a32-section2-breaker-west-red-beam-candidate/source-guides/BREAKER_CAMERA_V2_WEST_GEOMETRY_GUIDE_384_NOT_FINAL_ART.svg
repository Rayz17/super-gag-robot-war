<svg xmlns="http://www.w3.org/2000/svg" width="384" height="384" viewBox="0 0 384 384">
  <!-- Non-identity geometry only. Transparent canvas; no BREAKER armor pixels. -->
  <g fill="none" stroke="#55c4dc" stroke-opacity="0.38" stroke-width="2">
    <!-- Exact 3x3 grid from bottom-center pivot [192,320]. -->
    <path d="M192 320 L72 248 M232 296 L112 224 M272 272 L152 200 M312 248 L192 176"/>
    <path d="M192 320 L312 248 M152 296 L272 224 M112 272 L232 200 M72 248 L192 176"/>
  </g>

  <!-- Abstract low body envelope; deliberately untextured and non-identifying. -->
  <path d="M78 151 L119 112 L214 119 L300 181 L291 231 L241 265 L146 257 L86 214 Z"
        fill="#476f7e" fill-opacity="0.17" stroke="#61daee" stroke-opacity="0.75" stroke-width="4"/>
  <path d="M105 151 L270 232" fill="none" stroke="#61daee" stroke-opacity="0.50" stroke-width="3"/>

  <!-- Four load-bearing contact modules. -->
  <g fill="#4a6069" fill-opacity="0.28" stroke="#61daee" stroke-opacity="0.75" stroke-width="3">
    <rect x="84" y="218" width="38" height="49" rx="7"/>
    <rect x="143" y="249" width="38" height="50" rx="7"/>
    <rect x="225" y="213" width="38" height="50" rx="7"/>
    <rect x="270" y="243" width="38" height="51" rx="7"/>
  </g>

  <!-- Unique west-facing head/front at screen upper-left. -->
  <path d="M69 164 L93 139 L122 146 L116 180 L86 191 Z"
        fill="#2c3e44" fill-opacity="0.62" stroke="#61daee" stroke-opacity="0.90" stroke-width="3"/>
  <path d="M79 166 L105 156" fill="none" stroke="#f2362d" stroke-width="6" stroke-linecap="round"/>

  <!-- Exact screen vector WEST [-40,-24], displayed at 2x. -->
  <path d="M196 180 L116 132" fill="none" stroke="#f9c949" stroke-width="6" stroke-linecap="round"/>
  <path d="M116 132 L137 134 L126 150 Z" fill="#f9c949"/>

  <!-- Exact bottom-center pivot [192,320]. -->
  <circle cx="192" cy="320" r="8" fill="#ffffff" fill-opacity="0.92" stroke="#142229" stroke-width="2"/>
  <path d="M174 320 H210 M192 302 V338" fill="none" stroke="#ffffff" stroke-opacity="0.90" stroke-width="2"/>
</svg>
