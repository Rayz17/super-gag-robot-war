<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#21a366"/>
    </marker>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#18202a" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1536" height="1024" fill="#f3f5f7"/>
  <rect x="38" y="42" width="700" height="930" rx="30" fill="#ffffff" stroke="#c8d0d8" stroke-width="5"/>
  <rect x="798" y="42" width="700" height="930" rx="30" fill="#ffffff" stroke="#c8d0d8" stroke-width="5"/>

  <g font-family="Arial, Helvetica, sans-serif" fill="#1d2733">
    <text x="78" y="105" font-size="42" font-weight="700">R2 BLOCK</text>
    <text x="838" y="105" font-size="42" font-weight="700">R3 BASH</text>
    <text x="78" y="145" font-size="22">same fixed raised dimetric camera / logical SOUTH</text>
    <text x="838" y="145" font-size="22">same facing; shield sweeps laterally down-left</text>
  </g>

  <!-- LEFT: R2 BLOCK. SVG order deliberately encodes body_back -> shield -> forearms/hands_front. -->
  <g id="r2-block" filter="url(#shadow)">
    <!-- BODY BACK: generic, non-identity geometry -->
    <g id="r2-body-back" fill="#5f6874" stroke="#26313c" stroke-width="9" stroke-linejoin="round">
      <path d="M438 174 L501 207 L487 279 L422 301 L367 263 L379 195 Z"/>
      <path d="M379 195 L438 174 L501 207 L445 227 Z" fill="#89929c"/>
      <path d="M311 278 L421 246 L543 292 L526 444 L412 518 L292 432 Z"/>
      <path d="M421 246 L543 292 L481 326 L352 300 Z" fill="#89929c"/>
      <path d="M329 465 L428 475 L427 638 L334 664 L286 579 Z"/>
      <path d="M428 475 L518 470 L559 568 L493 651 L427 638 Z"/>
      <path d="M334 624 L426 612 L393 818 L300 840 L270 756 Z"/>
      <path d="M427 612 L493 628 L548 784 L468 838 L393 818 Z"/>
      <path d="M300 818 L393 800 L361 900 L205 925 L224 858 Z"/>
      <path d="M468 819 L548 784 L590 875 L455 923 L414 873 Z"/>
      <ellipse cx="307" cy="344" rx="71" ry="82"/>
      <ellipse cx="523" cy="358" rx="72" ry="84"/>
    </g>

    <!-- SHIELD MIDDLE: centered in chest/abdomen front -->
    <g id="r2-shield-middle" stroke="#6b4e00" stroke-width="10" stroke-linejoin="round">
      <path d="M258 304 L375 248 L497 300 L527 394 L491 702 L370 794 L244 705 L207 410 Z" fill="#f2bd38"/>
      <path d="M375 248 L402 276 L413 751 L370 794 L333 746 L340 279 Z" fill="#fff2b8"/>
      <path d="M258 304 L375 248 L340 279 L225 423 L207 410 Z" fill="#ffe18b"/>
      <path d="M497 300 L527 394 L491 702 L455 675 L464 330 Z" fill="#d99500"/>
      <path d="M221 440 L263 421 L277 674 L240 689 Z" fill="#5f6874"/>
      <path d="M477 405 L513 424 L486 660 L450 650 Z" fill="#5f6874"/>
    </g>

    <!-- FOREARMS / HANDS FRONT: both visibly contact the two grip zones -->
    <g id="r2-arms-hands-front" stroke="#064861" stroke-width="9" stroke-linejoin="round">
      <path d="M282 334 L217 360 L185 481 L232 535 L285 499 L302 401 Z" fill="#31b6d9"/>
      <path d="M531 345 L596 385 L580 508 L520 549 L482 500 L495 399 Z" fill="#31b6d9"/>
      <path d="M221 434 L273 426 L284 520 L235 532 L209 494 Z" fill="#eb4e7a"/>
      <path d="M473 421 L519 432 L522 530 L474 529 L451 490 Z" fill="#eb4e7a"/>
      <rect x="239" y="438" width="20" height="78" rx="10" fill="#fff2b8" stroke="#6b4e00" stroke-width="6"/>
      <rect x="479" y="438" width="20" height="78" rx="10" fill="#fff2b8" stroke="#6b4e00" stroke-width="6"/>
    </g>
  </g>

  <!-- RIGHT: R3 BASH. Same layer order, radically different silhouette. -->
  <g id="r3-bash" filter="url(#shadow)">
    <!-- BODY BACK: generic twisted body, still faces south/down-left -->
    <g id="r3-body-back" fill="#5f6874" stroke="#26313c" stroke-width="9" stroke-linejoin="round">
      <path d="M1213 177 L1272 222 L1246 293 L1178 303 L1133 253 L1151 190 Z"/>
      <path d="M1151 190 L1213 177 L1272 222 L1209 229 Z" fill="#89929c"/>
      <path d="M1065 295 L1188 246 L1316 324 L1277 471 L1141 518 L1036 423 Z"/>
      <path d="M1188 246 L1316 324 L1236 343 L1100 305 Z" fill="#89929c"/>
      <path d="M1080 468 L1170 480 L1140 636 L1046 656 L1007 572 Z"/>
      <path d="M1170 480 L1260 466 L1314 556 L1267 651 L1140 636 Z"/>
      <path d="M1052 614 L1141 627 L1063 820 L949 844 L925 756 Z"/>
      <path d="M1141 627 L1267 619 L1371 792 L1291 854 L1132 793 Z"/>
      <path d="M949 821 L1063 798 L1001 914 L836 934 L865 868 Z"/>
      <path d="M1291 829 L1371 792 L1452 865 L1331 935 L1242 894 Z"/>
      <ellipse cx="1052" cy="355" rx="73" ry="83"/>
      <ellipse cx="1298" cy="384" rx="72" ry="86"/>
    </g>

    <!-- SHIELD MIDDLE: translated and rotated into a lateral sweeping silhouette -->
    <g id="r3-shield-middle" stroke="#6b4e00" stroke-width="10" stroke-linejoin="round">
      <path d="M866 410 L982 343 L1295 442 L1354 532 L1260 683 L930 685 L823 590 Z" fill="#f2bd38"/>
      <path d="M982 343 L1040 366 L1260 683 L1184 683 L960 397 Z" fill="#fff2b8"/>
      <path d="M866 410 L982 343 L960 397 L841 531 L823 590 Z" fill="#ffe18b"/>
      <path d="M1295 442 L1354 532 L1260 683 L1226 635 L1282 474 Z" fill="#d99500"/>
      <path d="M930 425 L973 412 L1036 632 L991 646 Z" fill="#5f6874"/>
      <path d="M1175 470 L1218 487 L1270 620 L1224 641 Z" fill="#5f6874"/>
      <path d="M826 557 L873 532 L930 685 L823 590 Z" fill="#ee5b45"/>
    </g>

    <!-- FOREARMS / HANDS FRONT: both hands stay on their grip zones during the sweep -->
    <g id="r3-arms-hands-front" stroke="#064861" stroke-width="9" stroke-linejoin="round">
      <path d="M1055 337 L985 361 L932 481 L986 536 L1041 496 L1081 397 Z" fill="#31b6d9"/>
      <path d="M1305 371 L1361 424 L1326 554 L1255 578 L1224 518 L1260 415 Z" fill="#31b6d9"/>
      <path d="M942 449 L991 429 L1035 515 L988 541 L951 508 Z" fill="#eb4e7a"/>
      <path d="M1208 481 L1255 475 L1286 561 L1234 575 L1202 542 Z" fill="#eb4e7a"/>
      <rect x="971" y="438" width="20" height="82" rx="10" transform="rotate(-16 981 479)" fill="#fff2b8" stroke="#6b4e00" stroke-width="6"/>
      <rect x="1238" y="487" width="20" height="82" rx="10" transform="rotate(-16 1248 528)" fill="#fff2b8" stroke="#6b4e00" stroke-width="6"/>
    </g>
  </g>

  <!-- Explicit SOUTH vectors, identical in both panels -->
  <g stroke="#21a366" stroke-width="12" fill="none" marker-end="url(#arrow)">
    <path d="M448 595 L245 845"/>
    <path d="M1189 610 L936 870"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" fill="#16814f" font-size="28" font-weight="700">
    <text x="80" y="880">SOUTH [-40,+24]</text>
    <text x="1170" y="905">SOUTH [-40,+24]</text>
  </g>

  <!-- Global layer legend. Colors are semantic only and must not be copied as identity. -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">
    <text x="386" y="1008" fill="#26313c">LAYER ORDER:</text>
    <text x="545" y="1008" fill="#5f6874">BODY BACK</text>
    <text x="696" y="1008" fill="#26313c">→</text>
    <text x="733" y="1008" fill="#c68a00">SHIELD</text>
    <text x="829" y="1008" fill="#26313c">→</text>
    <text x="866" y="1008" fill="#1594b5">FOREARMS</text>
    <text x="1000" y="1008" fill="#26313c">→</text>
    <text x="1037" y="1008" fill="#d73261">HANDS / GRIPS FRONT</text>
  </g>
</svg>
