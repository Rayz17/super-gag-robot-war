<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024">
  <title>Guardian Z south shield hold block bash geometry guide</title>
  <desc>Internal pose-only guide. Three 512 by 1024 cells share one body proportion and foot pivot. Not final art.</desc>
  <defs>
    <style>
      .panel { fill:#f3f0e8; stroke:#24333b; stroke-width:4; }
      .axis { fill:none; stroke:#18a6a6; stroke-width:8; stroke-dasharray:18 14; opacity:.78; }
      .joint { fill:#ffd35b; stroke:#241e19; stroke-width:5; }
      .limb-back { fill:none; stroke:#17242e; stroke-width:58; stroke-linecap:round; stroke-linejoin:round; }
      .limb-front { fill:none; stroke:#294b70; stroke-width:42; stroke-linecap:round; stroke-linejoin:round; }
      .torso { fill:#243f5d; stroke:#121a21; stroke-width:9; }
      .chest { fill:#bf3c32; stroke:#e7b44d; stroke-width:8; }
      .core { fill:#194d80; stroke:#e7b44d; stroke-width:7; }
      .head { fill:#202d3b; stroke:#121a21; stroke-width:8; }
      .horn { fill:#e7b44d; stroke:#382d20; stroke-width:6; }
      .eye { fill:#f9e17a; stroke:#2a2520; stroke-width:4; }
      .leg { fill:#243f5d; stroke:#121a21; stroke-width:10; }
      .foot { fill:#1b3047; stroke:#121a21; stroke-width:9; }
      .shield { fill:#234f82; stroke:#242c32; stroke-width:18; stroke-linejoin:round; }
      .shield-panel { fill:#eee7d6; stroke:#d29c36; stroke-width:7; stroke-linejoin:round; }
      .shield-spine { fill:none; stroke:#303a40; stroke-width:18; stroke-linecap:round; }
      .force { fill:none; stroke:#e24b3e; stroke-width:12; stroke-linecap:round; marker-end:url(#arrow); }
      .pivot { stroke:#d94538; stroke-width:6; }
      .grip { fill:#62e0cc; stroke:#132a2a; stroke-width:6; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#e24b3e"/>
    </marker>
    <g id="head">
      <path class="head" d="M-54,-52 L-28,-84 L30,-79 L58,-42 L43,34 L0,55 L-43,35 Z"/>
      <path class="horn" d="M-38,-60 L-95,-111 L-76,-28 Z"/>
      <path class="horn" d="M30,-68 L87,-108 L67,-22 Z"/>
      <path class="horn" d="M-3,-84 L18,-139 L27,-76 Z"/>
      <path class="eye" d="M-38,-18 L-3,-8 L-14,9 L-42,2 Z"/>
      <path class="eye" d="M4,-8 L40,-18 L43,2 L14,9 Z"/>
    </g>
    <g id="torso">
      <path class="torso" d="M-111,-40 L-72,-104 L77,-100 L116,-25 L82,111 L-77,112 Z"/>
      <path class="chest" d="M-94,-37 L-17,-72 L-8,56 L-73,75 Z"/>
      <path class="chest" d="M-12,-73 L79,-43 L69,74 L0,56 Z"/>
      <path class="core" d="M-19,-70 L15,-70 L18,57 L-7,61 Z"/>
    </g>
  </defs>

  <rect x="4" y="4" width="504" height="1016" rx="20" class="panel"/>
  <rect x="516" y="4" width="504" height="1016" rx="20" class="panel"/>
  <rect x="1028" y="4" width="504" height="1016" rx="20" class="panel"/>

