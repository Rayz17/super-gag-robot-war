    <path class="leg" d="M727,603 L652,719 L622,853 L704,877 L751,739 L789,622 Z"/>
    <path class="leg" d="M814,613 L844,720 L881,850 L949,819 L895,686 L874,587 Z"/>
    <path class="foot" d="M598,840 L707,853 L721,899 L583,890 Z"/>
    <path class="foot" d="M868,827 L952,802 L989,865 L878,894 Z"/>
    <g transform="translate(805 269) rotate(-17)"><use href="#head"/></g>
    <g transform="translate(802 455) rotate(-14)"><use href="#torso"/></g>
    <path class="limb-back" d="M713,378 L646,468 L677,534"/>
    <path class="limb-front" d="M713,378 L646,468 L677,534"/>
    <path class="limb-back" d="M883,381 L851,482 L776,548"/>
    <path class="limb-front" d="M883,381 L851,482 L776,548"/>
    <path class="shield" d="M564,278 L716,246 L814,352 L790,631 L659,788 L548,650 Z"/>
    <path class="shield-panel" d="M589,309 L710,280 L777,366 L757,600 L663,733 L581,622 Z"/>
    <path class="shield-spine" d="M709,286 L684,713"/>
    <circle class="grip" cx="677" cy="534" r="20"/>
