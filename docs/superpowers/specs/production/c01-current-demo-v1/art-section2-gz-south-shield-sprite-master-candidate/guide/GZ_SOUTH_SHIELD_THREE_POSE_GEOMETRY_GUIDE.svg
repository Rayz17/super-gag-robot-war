  <g id="shield-bash-contact">
    <path class="axis" d="M1429,142 L1127,835"/>
    <path class="leg" d="M1222,599 L1146,700 L1102,839 L1181,873 L1248,732 L1285,613 Z"/>
    <path class="leg" d="M1316,612 L1372,704 L1428,831 L1492,786 L1419,666 L1374,575 Z"/>
    <path class="foot" d="M1072,827 L1184,849 L1194,897 L1052,884 Z"/>
    <path class="foot" d="M1410,811 L1494,770 L1530,831 L1427,891 Z"/>
    <g transform="translate(1324 261) rotate(-25)"><use href="#head"/></g>
    <g transform="translate(1301 450) rotate(-28)"><use href="#torso"/></g>
    <path class="limb-back" d="M1208,368 L1138,453 L1176,526"/>
    <path class="limb-front" d="M1208,368 L1138,453 L1176,526"/>
    <path class="limb-back" d="M1388,382 L1324,483 L1239,549"/>
    <path class="limb-front" d="M1388,382 L1324,483 L1239,549"/>
    <path class="shield" d="M1048,418 L1144,365 L1287,539 L1259,641 L1130,739 L1034,669 Z"/>
    <path class="shield-panel" d="M1075,437 L1139,403 L1249,540 L1225,611 L1127,692 L1068,648 Z"/>
    <path class="shield-spine" d="M1118,422 L1219,640"/>
