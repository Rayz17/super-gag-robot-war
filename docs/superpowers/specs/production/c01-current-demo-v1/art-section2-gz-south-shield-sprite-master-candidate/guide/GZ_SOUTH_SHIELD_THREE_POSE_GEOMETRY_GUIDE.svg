    <path class="leg" d="M228,596 L184,722 L166,859 L238,872 L267,733 L286,608 Z"/>
    <path class="leg" d="M301,600 L308,736 L321,864 L391,848 L368,711 L358,585 Z"/>
    <path class="foot" d="M147,847 L238,850 L254,895 L133,895 Z"/>
    <path class="foot" d="M315,844 L390,831 L417,886 L316,895 Z"/>
    <g transform="translate(286 242) rotate(-13)"><use href="#head"/></g>
    <g transform="translate(286 424) rotate(-10)"><use href="#torso"/></g>
    <path class="limb-back" d="M205,351 L150,465 L174,541"/>
    <path class="limb-front" d="M205,351 L150,465 L174,541"/>
    <path class="limb-back" d="M363,351 L331,463 L273,528"/>
    <path class="limb-front" d="M363,351 L331,463 L273,528"/>
    <path class="shield" d="M75,331 L208,284 L302,365 L280,625 L157,772 L61,655 Z"/>
    <path class="shield-panel" d="M94,353 L202,317 L267,379 L249,593 L160,719 L91,630 Z"/>
    <path class="shield-spine" d="M197,326 L173,699"/>
