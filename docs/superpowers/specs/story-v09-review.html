<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>超GAG v09 剧情发动机审稿台</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f3ee;
      --paper: #ffffff;
      --paper-soft: #fbfaf7;
      --ink: #222321;
      --muted: #6f716f;
      --line: #d9d4ca;
      --line-strong: #bab3a6;
      --dark: #262625;
      --red: #aa4340;
      --teal: #246f69;
      --blue: #375f91;
      --gold: #94640f;
      --purple: #6d538c;
      --shadow: 0 12px 28px rgba(32, 28, 20, 0.08);
      --radius: 8px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      letter-spacing: 0;
    }

    button,
    input { font: inherit; }

    .app {
      height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    .topbar {
      padding: 18px 24px 14px;
      background: rgba(255, 255, 255, 0.9);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(12px);
      z-index: 2;
    }

    .toprow {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 18px;
    }

    h1 {
      margin: 0;
      font-size: 22px;
      line-height: 1.2;
      font-weight: 760;
    }

    .subtitle {
      margin-top: 7px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
    }

    .stats {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .stat {
      min-width: 84px;
      padding: 7px 10px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--paper-soft);
      text-align: right;
    }

    .stat strong {
      display: block;
      font-size: 18px;
      line-height: 1;
    }

    .stat span {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
    }

    .layout {
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(320px, 410px) minmax(0, 1fr);
    }

    .menu {
      min-height: 0;
      display: grid;
      grid-template-rows: auto auto auto 1fr;
      border-right: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.58);
    }

    .view-tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      padding: 14px 16px 12px;
      border-bottom: 1px solid var(--line);
    }

    .view-tab {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--paper);
      color: var(--muted);
      cursor: pointer;
      padding: 8px 10px;
      font-size: 13px;
      font-weight: 760;
      text-align: center;
    }

    .view-tab[aria-pressed="true"] {
      color: #fff;
      border-color: var(--dark);
      background: var(--dark);
    }

    .search {
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
    }

    .search input {
      width: 100%;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius);
      background: var(--paper);
      color: var(--ink);
      outline: none;
      padding: 10px 12px;
    }

    .search input:focus {
      border-color: var(--teal);
      box-shadow: 0 0 0 3px rgba(36, 111, 105, 0.14);
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--line);
      max-height: 120px;
      overflow: auto;
    }

    .filter {
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--paper);
      color: var(--muted);
      cursor: pointer;
      padding: 5px 9px;
      font-size: 12px;
      white-space: nowrap;
    }

    .filter[aria-pressed="true"] {
      color: #fff;
      border-color: var(--teal);
      background: var(--teal);
    }

    .item-list {
      min-height: 0;
      overflow: auto;
      padding: 10px;
    }

    .item-button {
      width: 100%;
      display: block;
      border: 1px solid transparent;
      border-radius: var(--radius);
      background: transparent;
      color: var(--ink);
      cursor: pointer;
      text-align: left;
      padding: 10px 11px;
      margin: 2px 0;
    }

    .item-button:hover {
      background: rgba(255, 255, 255, 0.86);
      border-color: var(--line);
    }

    .item-button.active {
      background: var(--paper);
      border-color: var(--line-strong);
      box-shadow: var(--shadow);
    }

    .item-title {
      display: grid;
      grid-template-columns: 52px minmax(0, 1fr);
      gap: 8px;
      align-items: start;
      font-size: 14px;
      line-height: 1.38;
      font-weight: 740;
    }

    .item-no {
      color: var(--teal);
      font-weight: 800;
    }

    .item-sub {
      margin-top: 6px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.42;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .detail {
      min-width: 0;
      overflow: auto;
      padding: 24px;
    }

    .detail-inner {
      max-width: 1120px;
      margin: 0 auto;
    }

    .detail-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 18px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--line);
    }

    h2 {
      margin: 0;
      font-size: 28px;
      line-height: 1.22;
      font-weight: 780;
    }

    .lead {
      margin-top: 10px;
      max-width: 860px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.72;
    }

    .head-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 10px;
    }

    .pill,
    .jump {
      display: inline-flex;
      align-items: center;
      min-height: 26px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--paper);
      color: var(--muted);
      padding: 4px 9px;
      font-size: 12px;
      line-height: 1.25;
      text-decoration: none;
      white-space: nowrap;
    }

    button.jump {
      cursor: pointer;
    }

    button.jump:hover {
      color: #fff;
      border-color: var(--dark);
      background: var(--dark);
    }

    .panel {
      margin-top: 18px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--paper);
      box-shadow: 0 3px 14px rgba(32, 28, 20, 0.04);
      padding: 18px;
    }

    .panel h3 {
      margin: 0 0 10px;
      color: #343330;
      font-size: 15px;
      line-height: 1.35;
    }

    .panel p {
      margin: 0;
      font-size: 15px;
      line-height: 1.78;
    }

    .chain {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    .stage-chip {
      display: inline-flex;
      align-items: center;
      min-height: 26px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--paper-soft);
      color: var(--muted);
      padding: 4px 9px;
      font-size: 12px;
      line-height: 1.25;
      white-space: nowrap;
    }

    .stage-chip.S { color: var(--teal); border-color: rgba(36,111,105,.34); background: rgba(36,111,105,.08); }
    .stage-chip.B { color: var(--blue); border-color: rgba(55,95,145,.34); background: rgba(55,95,145,.08); }
    .stage-chip.T { color: var(--gold); border-color: rgba(148,100,15,.34); background: rgba(148,100,15,.10); }
    .stage-chip.C { color: var(--red); border-color: rgba(170,67,64,.34); background: rgba(170,67,64,.08); }
    .stage-chip.P { color: var(--purple); border-color: rgba(109,83,140,.34); background: rgba(109,83,140,.08); }

    .spot-list,
    .rounds {
      display: grid;
      gap: 12px;
      margin-top: 12px;
    }

    .spot-card,
    .round-card {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--paper-soft);
      padding: 14px;
    }

    .spot-card {
      display: grid;
      grid-template-columns: 86px minmax(0, 1fr) auto;
      gap: 12px;
      align-items: start;
    }

    .spot-index {
      color: var(--teal);
      font-weight: 800;
      line-height: 1.5;
    }

    .spot-text {
      font-size: 14px;
      line-height: 1.7;
    }

    .round-card h4 {
      margin: 0;
      font-size: 15px;
      line-height: 1.4;
    }

    .round-card .fields {
      margin-top: 8px;
    }

    .plan-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      margin-top: 18px;
    }

    .full { grid-column: 1 / -1; }

    .related {
      margin-top: 18px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--paper);
      overflow: hidden;
    }

    details.related-group {
      border-top: 1px solid var(--line);
    }

    details.related-group:first-child {
      border-top: 0;
    }

    .related-group summary {
      list-style: none;
      cursor: pointer;
      padding: 14px 16px;
      font-weight: 740;
      display: flex;
      justify-content: space-between;
      gap: 12px;
    }

    .related-group summary::-webkit-details-marker {
      display: none;
    }

    .related-group summary span {
      color: var(--muted);
      font-size: 12px;
      font-weight: 520;
      white-space: nowrap;
    }

    .related-body {
      padding: 0 16px 16px;
      display: grid;
      gap: 12px;
    }

    .mini-card {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--paper-soft);
      padding: 14px;
    }

    .mini-card h4 {
      margin: 0 0 8px;
      font-size: 15px;
      line-height: 1.35;
    }

    .mini-head {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 10px;
      align-items: flex-start;
    }

    .fields {
      display: grid;
      grid-template-columns: 132px minmax(0, 1fr);
      gap: 7px 12px;
      margin: 10px 0 0;
      font-size: 14px;
      line-height: 1.65;
    }

    .fields dt {
      color: var(--muted);
      font-weight: 700;
    }

    .fields dd {
      margin: 0;
    }

    .empty,
    .error {
      border: 1px dashed var(--line-strong);
      border-radius: var(--radius);
      background: rgba(255,255,255,0.68);
      color: var(--muted);
      padding: 18px;
      line-height: 1.7;
    }

    .error {
      color: var(--red);
      border-color: rgba(170, 67, 64, 0.42);
      background: rgba(170, 67, 64, 0.06);
    }

    @media (max-width: 920px) {
      .app {
        height: auto;
        min-height: 100vh;
      }

      .toprow {
        align-items: flex-start;
        flex-direction: column;
      }

      .stats {
        justify-content: flex-start;
      }

      .layout {
        grid-template-columns: 1fr;
      }

      .menu {
        border-right: 0;
        border-bottom: 1px solid var(--line);
        max-height: 54vh;
      }

      .detail {
        padding: 18px;
      }

      .plan-grid,
      .fields,
      .spot-card {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="toprow">
        <div>
          <h1>超GAG v09 剧情发动机审稿台</h1>
          <div class="subtitle">按 v07 内容结构重排：左侧默认50问题菜单，右侧优先展示本问题方案、密集话级落点、v06到v09的增强演进，再展开关联逐话和人物弧线。</div>
        </div>
        <div class="stats" id="stats"></div>
      </div>
    </header>

    <main class="layout">
      <aside class="menu">
        <div class="view-tabs" id="viewTabs"></div>
        <div class="search">
          <input id="search" type="search" placeholder="搜索问题、话号、人物、物件、动作">
        </div>
        <div class="filters" id="filters"></div>
        <div class="item-list" id="itemList"></div>
      </aside>

      <section class="detail" id="detail">
        <div class="detail-inner">
          <div class="empty">正在读取 v09 剧情发动机表。</div>
        </div>
      </section>
    </main>
  </div>

  <script>
    const FILES = {
      issues: "data/story/issue_story_engine_groups_v09.tsv",
      issueV06: "data/story/issue_episode_revision_targets_v06.tsv",
      issueV07: "data/story/issue_episode_revision_targets_v07.tsv",
      issueV08: "data/story/issue_episode_revision_targets_v08.tsv",
      episodes: "data/story/episode_story_engine_targets_v09.tsv",
      arcs: "data/story/character_arc_ladders_v09.tsv"
    };

    const VIEWS = {
      issues: {
        label: "50问题",
        no: row => row["问题编号"],
        title: row => `${row["问题编号"]}. ${row["问题标题"]}`,
        sub: row => row["v09剧情发动机"]
      },
      episodes: {
        label: "逐话",
        no: row => row["话号"],
        title: row => `${row["话号"]} ${row["标题"]}`,
        sub: row => row["不可逆动作"]
      },
      arcs: {
        label: "人物关系",
        no: row => row["话号"],
        title: row => `${row["人物/关系"]} · ${row["话号"]}`,
        sub: row => row["不可逆动作"]
      }
    };

    const ISSUE_RANGES = [
      { value: "all", label: "全部" },
      { value: "1-10", label: "1-10" },
      { value: "11-20", label: "11-20" },
      { value: "21-30", label: "21-30" },
      { value: "31-40", label: "31-40" },
      { value: "41-50", label: "41-50" }
    ];

    const STAGE_LABEL = {
      S: "埋种",
      B: "推进",
      T: "转折",
      C: "高潮",
      P: "回收"
    };

    const state = {
      data: { issues: [], issueV06: [], issueV07: [], issueV08: [], episodes: [], arcs: [] },
      view: "issues",
      query: "",
      filter: { issues: "all", episodes: "all", arcs: "all" },
      selected: { issues: "", episodes: "", arcs: "" }
    };

    const els = {
      stats: document.getElementById("stats"),
      viewTabs: document.getElementById("viewTabs"),
      search: document.getElementById("search"),
      filters: document.getElementById("filters"),
      itemList: document.getElementById("itemList"),
      detail: document.getElementById("detail")
    };

    init();

    async function init() {
      try {
        const entries = await Promise.all(Object.entries(FILES).map(async ([key, path]) => {
          const text = await loadText(path);
          return [key, parseTsv(text).map((row, index) => ({ ...row, _uid: `${key}:${index}` }))];
        }));
        state.data = Object.fromEntries(entries);
        Object.keys(VIEWS).forEach(key => {
          state.selected[key] = state.data[key][0]?._uid || "";
        });
        renderAll();
      } catch (error) {
        renderError(error);
      }
    }

    async function loadText(path) {
      const response = await fetch(path, { cache: "no-store" });
      if (!response.ok) throw new Error(`${path} 读取失败：${response.status}`);
      return response.text();
    }

    function parseTsv(text) {
      const lines = text.replace(/\r/g, "").trim().split("\n").filter(Boolean);
      const headers = lines.shift().split("\t");
      return lines.map((line, index) => {
        const cells = line.split("\t");
        const row = { _index: index };
        headers.forEach((header, i) => row[header] = cells[i] || "");
        row._text = cells.join(" ");
        return row;
      });
    }

    function renderAll() {
      renderStats();
      renderViewTabs();
      renderFilters();
      renderItemList();
      renderDetail();
    }

    function renderStats() {
      els.stats.innerHTML = [
        [state.data.issues.length, "问题项"],
        [state.data.episodes.length, "主线话"],
        [state.data.arcs.length, "弧线节点"]
      ].map(([value, label]) => (
        `<div class="stat"><strong>${escapeHtml(value)}</strong><span>${escapeHtml(label)}</span></div>`
      )).join("");
    }

    function renderViewTabs() {
      els.viewTabs.innerHTML = Object.entries(VIEWS).map(([key, view]) => (
        `<button class="view-tab" data-view="${key}" aria-pressed="${state.view === key}">${view.label}</button>`
      )).join("");
      els.viewTabs.querySelectorAll(".view-tab").forEach(button => {
        button.addEventListener("click", () => {
          state.view = button.dataset.view;
          state.query = "";
          els.search.value = "";
          ensureSelection();
          renderViewTabs();
          renderFilters();
          renderItemList();
          renderDetail();
        });
      });
    }

    function renderFilters() {
      const options = filterOptions();
      els.filters.innerHTML = options.map(option => (
        `<button class="filter" data-filter="${escapeAttr(option.value)}" aria-pressed="${state.filter[state.view] === option.value}">${escapeHtml(option.label)}</button>`
      )).join("");
      els.filters.querySelectorAll(".filter").forEach(button => {
        button.addEventListener("click", () => {
          state.filter[state.view] = button.dataset.filter;
          ensureSelection();
          renderFilters();
          renderItemList();
          renderDetail();
        });
      });
    }

    function filterOptions() {
      if (state.view === "issues") return ISSUE_RANGES;
      if (state.view === "episodes") {
        const chapters = unique(state.data.episodes.map(row => String(row["话号"]).split("-")[0]));
        return [{ value: "all", label: "全部" }, ...chapters.map(chapter => ({ value: chapter, label: `第${chapter}章` }))];
      }
      const names = unique(state.data.arcs.map(row => row["人物/关系"]));
      return [{ value: "all", label: "全部" }, ...names.map(name => ({ value: name, label: name }))];
    }

    function renderItemList() {
      const rows = visibleRows();
      ensureSelection();
      els.itemList.innerHTML = rows.length ? rows.map(row => renderItemButton(row)).join("") : `<div class="empty">没有匹配内容。</div>`;
      els.itemList.querySelectorAll(".item-button").forEach(button => {
        button.addEventListener("click", () => {
          state.selected[state.view] = button.dataset.uid;
          renderItemList();
          renderDetail();
        });
      });
    }

    function renderItemButton(row) {
      const view = VIEWS[state.view];
      const active = row._uid === state.selected[state.view] ? " active" : "";
      return `
        <button class="item-button${active}" data-uid="${escapeAttr(row._uid)}">
          <div class="item-title">
            <span class="item-no">${escapeHtml(view.no(row))}</span>
            <span>${escapeHtml(view.title(row))}</span>
          </div>
          <div class="item-sub">${escapeHtml(view.sub(row))}</div>
        </button>
      `;
    }

    function visibleRows() {
      const query = state.query.trim().toLowerCase();
      return state.data[state.view].filter(row => {
        const filtered = rowMatchesFilter(row);
        const matched = !query || row._text.toLowerCase().includes(query);
        return filtered && matched;
      });
    }

    function rowMatchesFilter(row) {
      const value = state.filter[state.view];
      if (value === "all") return true;
      if (state.view === "issues") {
        const [start, end] = value.split("-").map(Number);
        const number = Number(row["问题编号"]);
        return number >= start && number <= end;
      }
      if (state.view === "episodes") return String(row["话号"]).startsWith(`${value}-`);
      if (state.view === "arcs") return row["人物/关系"] === value;
      return true;
    }

    function ensureSelection() {
      const rows = visibleRows();
      if (!rows.some(row => row._uid === state.selected[state.view])) {
        state.selected[state.view] = rows[0]?._uid || "";
      }
    }

    function renderDetail() {
      const row = state.data[state.view].find(item => item._uid === state.selected[state.view]);
      if (!row) {
        els.detail.innerHTML = `<div class="detail-inner"><div class="empty">请选择左侧条目。</div></div>`;
        return;
      }
      if (state.view === "issues") renderIssue(row);
      if (state.view === "episodes") renderEpisode(row);
      if (state.view === "arcs") renderArc(row);
    }

    function renderIssue(row) {
      const v06 = issueRound("issueV06", row);
      const v07 = issueRound("issueV07", row);
      const v08 = issueRound("issueV08", row);
      const spots = parseSpotList(v07?.["关键话级落点"] || v06?.["关键话级落点"] || "");
      const chain = parseEpisodeChain(v08?.["覆盖话号链"] || "");
      const spotEpisodeSet = new Set(spots.map(item => item.episode).filter(Boolean));
      const chainEpisodeSet = new Set(chain.map(item => item.episode));
      const relatedEpisodeNos = orderedUnique([...spots.map(item => item.episode), ...chain.map(item => item.episode)].filter(Boolean));
      const relatedEpisodes = relatedEpisodeNos
        .map(episodeNo => state.data.episodes.find(ep => ep["话号"] === episodeNo))
        .filter(Boolean);
      const chainEpisodes = chain
        .map(item => state.data.episodes.find(ep => ep["话号"] === item.episode))
        .filter(Boolean);
      const relatedArcs = state.data.arcs.filter(item => spotEpisodeSet.has(item["话号"]) || chainEpisodeSet.has(item["话号"]));
      const sameEngine = state.data.issues.filter(item => item["v09剧情发动机"] === row["v09剧情发动机"]);
      renderPage({
        title: `${row["问题编号"]}. ${row["问题标题"]}`,
        lead: v07?.["覆盖规格"] || row["核心场面要求"],
        pills: [
          "50问题",
          v07?.["覆盖规格"] || "v07覆盖规格缺失",
          `${spots.length} 个v07落点`,
          `${chain.length} 个v08阶段点`,
          row["v09剧情发动机"]
        ],
        panels: [
          ["v07本问题方案", v07IssueSolution(v07, row)],
          ["v07重写检查点", v07?.["重写检查点"] || "未找到v07重写检查点。"],
          ["v07取舍说明", v07?.["取舍说明"] || "未找到v07取舍说明。"],
          ["v09最新增强", issueSolutionText(row)]
        ],
        extra: issueSpotPanel(v07, spots) + issueRevisionPanel(v06, v07, v08, row) + issueChainPanel(v08, chain),
        raw: mergeMany([
          ["v09", row],
          ["v08", v08],
          ["v07", v07],
          ["v06", v06]
        ]),
        groups: [
          group("本问题v07/v08落点对应逐话", relatedEpisodes, episodeCard, true),
          group("本问题v08阶段链对应逐话", chainEpisodes, episodeCard, false),
          group("本问题相关人物/关系弧线", relatedArcs, arcCard, true),
          group("同一剧情发动机的问题组", sameEngine, issueCard, false),
          group("逐话剧情发动机全量索引", state.data.episodes, episodeCard, false),
          group("人物/关系弧线全量索引", state.data.arcs, arcCard, false),
          group("50问题全量对照", state.data.issues, issueCard, false)
        ]
      });
    }

    function renderEpisode(row) {
      const arcs = state.data.arcs.filter(item => item["话号"] === row["话号"]);
      renderPage({
        title: `${row["话号"]} ${row["标题"]}`,
        lead: row["v09剧情发动机"],
        pills: ["逐话发动机", `${arcs.length} 个本话弧线节点`, `第${String(row["话号"]).split("-")[0]}章`],
        panels: [
          ["v09剧情发动机", row["v09剧情发动机"]],
          ["不可逆动作", row["不可逆动作"]],
          ["关系/人物场面", row["关系/人物场面"]],
          ["情绪物件", row["情绪物件"]],
          ["下一话债务", row["下一话债务"]]
        ],
        raw: row,
        groups: [
          group("本话人物/关系弧线", arcs, arcCard, true),
          group("同章逐话索引", sameChapterEpisodes(row["话号"]), episodeCard, true),
          group("50问题发动机索引", state.data.issues, issueCard, false),
          group("人物/关系弧线全量索引", state.data.arcs, arcCard, false)
        ]
      });
    }

    function renderArc(row) {
      const episode = state.data.episodes.filter(item => item["话号"] === row["话号"]);
      const sameRelation = state.data.arcs.filter(item => item["人物/关系"] === row["人物/关系"]);
      renderPage({
        title: `${row["人物/关系"]} · ${row["话号"]}`,
        lead: row["不可逆动作"],
        pills: [row["阶段"], row["弧线ID"], `${sameRelation.length} 个同线节点`],
        panels: [
          ["戏剧欲望", row["戏剧欲望"]],
          ["恐惧/误判", row["恐惧/误判"]],
          ["不可逆动作", row["不可逆动作"]],
          ["关系物件/场面", row["关系物件/场面"]],
          ["玩法/系统承载", row["玩法/系统承载"]],
          ["后续债务", row["后续债务"]]
        ],
        raw: row,
        groups: [
          group("本话逐话发动机", episode, episodeCard, true),
          group(`同一人物/关系弧线：${row["人物/关系"]}`, sameRelation, arcCard, true),
          group("50问题发动机索引", state.data.issues, issueCard, false),
          group("逐话剧情发动机全量索引", state.data.episodes, episodeCard, false)
        ]
      });
    }

    function renderPage({ title, lead, pills, panels, extra = "", raw, groups }) {
      els.detail.innerHTML = `
        <div class="detail-inner">
          <div class="detail-head">
            <div>
              <h2>${escapeHtml(title)}</h2>
              <div class="lead">${escapeHtml(lead)}</div>
              <div class="head-meta">${pills.map(pill => `<span class="pill">${escapeHtml(pill)}</span>`).join("")}</div>
            </div>
          </div>
          <div class="plan-grid">
            ${panels.map(([heading, text], index) => panel(heading, text, index === 0)).join("")}
          </div>
          ${extra}
          ${rawFields("完整原始字段", raw)}
          <div class="related">
            ${groups.join("")}
          </div>
        </div>
      `;
      bindJumpButtons();
    }

    function panel(title, text, full) {
      return `
        <section class="panel${full ? " full" : ""}">
          <h3>${escapeHtml(title)}</h3>
          <p>${escapeHtml(text)}</p>
        </section>
      `;
    }

    function rawFields(title, row) {
      return `
        <section class="panel">
          <h3>${escapeHtml(title)}</h3>
          ${fieldList(row)}
        </section>
      `;
    }

    function issueRound(key, row) {
      return state.data[key].find(item => item["问题编号"] === row["问题编号"]);
    }

    function v07IssueSolution(v07, row) {
      if (!v07) return `v07方案缺失；暂以v09发动机处理：${issueSolutionText(row)}`;
      return `${v07["覆盖规格"]}。执行时按“关键话级落点”逐条检查：${v07["重写检查点"]}`;
    }

    function issueSolutionText(row) {
      return `用“${row["v09剧情发动机"]}”继续增强这个问题：${row["核心场面要求"]}；失败判定是“${row["失败判定"]}”。`;
    }

    function issueSpotPanel(v07, spots) {
      if (!v07) return panel("v07密集话级落点", "未找到v07落点表。", true);
      return `
        <section class="panel">
          <h3>v07密集话级落点</h3>
          <p>${escapeHtml(v07["覆盖规格"])}</p>
          <div class="spot-list">
            ${spots.length ? spots.map(spotCard).join("") : `<div class="empty">没有解析到关键话级落点。</div>`}
          </div>
        </section>
      `;
    }

    function spotCard(item) {
      const episode = state.data.episodes.find(row => row["话号"] === item.episode);
      const button = episode ? `<button class="jump" data-view="episodes" data-uid="${escapeAttr(episode._uid)}">打开逐话</button>` : "";
      return `
        <article class="spot-card">
          <div class="spot-index">${escapeHtml(item.episode || "未标话号")}</div>
          <div class="spot-text">${escapeHtml(item.text)}</div>
          ${button}
        </article>
      `;
    }

    function issueRevisionPanel(v06, v07, v08, v09) {
      return `
        <section class="panel">
          <h3>各轮增强和优化</h3>
          <div class="rounds">
            ${revisionRoundCard("v06 关键话号化", v06, [
              ["关键话级落点", v06?.["关键话级落点"]],
              ["重写检查点", v06?.["重写检查点"]],
              ["取舍说明", v06?.["取舍说明"]]
            ])}
            ${revisionRoundCard("v07 密集话级落点", v07, [
              ["覆盖规格", v07?.["覆盖规格"]],
              ["关键话级落点", v07?.["关键话级落点"]],
              ["重写检查点", v07?.["重写检查点"]],
              ["取舍说明", v07?.["取舍说明"]]
            ])}
            ${revisionRoundCard("v08 承压链和质变节点", v08, [
              ["覆盖策略", v08?.["覆盖策略"]],
              ["覆盖话号链", v08?.["覆盖话号链"]],
              ["质变/高潮节点", v08?.["质变/高潮节点"]],
              ["重写验收口径", v08?.["重写验收口径"]]
            ])}
            ${revisionRoundCard("v09 剧情发动机增强", v09, [
              ["v08失败表现", v09?.["v08失败表现"]],
              ["v09剧情发动机", v09?.["v09剧情发动机"]],
              ["核心场面要求", v09?.["核心场面要求"]],
              ["失败判定", v09?.["失败判定"]]
            ])}
          </div>
        </section>
      `;
    }

    function revisionRoundCard(title, row, fields) {
      return `
        <article class="round-card">
          <h4>${escapeHtml(title)}</h4>
          ${row ? fieldListFromPairs(fields.map(([key, value]) => [key, value || ""])) : `<div class="empty">这一轮没有找到对应数据。</div>`}
        </article>
      `;
    }

    function issueChainPanel(v08, chain) {
      if (!v08) {
        return panel("v08阶段覆盖链", "未找到v08覆盖链对照。", true);
      }
      return `
        <section class="panel">
          <h3>v08阶段覆盖链</h3>
          <p>${escapeHtml(v08["覆盖策略"])}</p>
          <div class="chain">
            ${chain.length ? chain.map(stageChip).join("") : `<span class="stage-chip">无覆盖话号</span>`}
          </div>
        </section>
      `;
    }

    function parseEpisodeChain(text) {
      return [...String(text || "").matchAll(/(\d+-\d+)\[([SBTCP])\]/g)]
        .map(match => ({ episode: match[1], stage: match[2] }));
    }

    function parseSpotList(text) {
      return String(text || "")
        .split(";")
        .map(item => item.trim())
        .filter(Boolean)
        .map(item => {
          const match = item.match(/^(\d+-\d+)[:：](.*)$/);
          return match ? { episode: match[1], text: match[2].trim() } : { episode: "", text: item };
        });
    }

    function stageChip(item) {
      return `<span class="stage-chip ${escapeAttr(item.stage)}">${escapeHtml(item.episode)} · ${escapeHtml(STAGE_LABEL[item.stage] || item.stage)}</span>`;
    }

    function mergeMany(pairs) {
      const merged = {};
      pairs.forEach(([prefix, row]) => {
        if (!row) return;
        Object.entries(row).forEach(([key, value]) => {
          if (key.startsWith("_")) return;
          if ((key === "问题编号" || key === "问题标题") && merged[key]) return;
          merged[key === "问题编号" || key === "问题标题" ? key : `${prefix}:${key}`] = value;
        });
      });
      return merged;
    }

    function orderedUnique(values) {
      const seen = new Set();
      return values.filter(value => {
        if (seen.has(value)) return false;
        seen.add(value);
        return true;
      });
    }

    function group(title, rows, renderer, open) {
      return `
        <details class="related-group"${open ? " open" : ""}>
          <summary>${escapeHtml(title)} <span>${rows.length} 条</span></summary>
          <div class="related-body">
            ${rows.length ? rows.map(renderer).join("") : `<div class="empty">没有关联条目。</div>`}
          </div>
        </details>
      `;
    }

    function issueCard(row) {
      const v07 = issueRound("issueV07", row);
      const v08 = issueRound("issueV08", row);
      return miniCard(
        `${row["问题编号"]}. ${row["问题标题"]}`,
        "issues",
        row,
        [
          ["v07覆盖规格", v07?.["覆盖规格"] || ""],
          ["v07关键话级落点", v07?.["关键话级落点"] || ""],
          ["v08覆盖话号链", v08?.["覆盖话号链"] || ""],
          ["v09剧情发动机", row["v09剧情发动机"]],
          ["核心场面要求", row["核心场面要求"]],
          ["失败判定", row["失败判定"]]
        ]
      );
    }

    function episodeCard(row) {
      return miniCard(
        `${row["话号"]} ${row["标题"]}`,
        "episodes",
        row,
        [
          ["剧情发动机", row["v09剧情发动机"]],
          ["不可逆动作", row["不可逆动作"]],
          ["关系/人物场面", row["关系/人物场面"]],
          ["情绪物件", row["情绪物件"]],
          ["下一话债务", row["下一话债务"]]
        ]
      );
    }

    function arcCard(row) {
      return miniCard(
        `${row["人物/关系"]} · ${row["话号"]} · ${row["阶段"]}`,
        "arcs",
        row,
        [
          ["戏剧欲望", row["戏剧欲望"]],
          ["恐惧/误判", row["恐惧/误判"]],
          ["不可逆动作", row["不可逆动作"]],
          ["关系物件/场面", row["关系物件/场面"]],
          ["玩法/系统承载", row["玩法/系统承载"]],
          ["后续债务", row["后续债务"]]
        ]
      );
    }

    function miniCard(title, view, row, fields) {
      return `
        <article class="mini-card">
          <div class="mini-head">
            <h4>${escapeHtml(title)}</h4>
            <button class="jump" data-view="${escapeAttr(view)}" data-uid="${escapeAttr(row._uid)}">打开</button>
          </div>
          ${fieldListFromPairs(fields)}
        </article>
      `;
    }

    function fieldList(row) {
      const fields = Object.entries(row).filter(([key]) => !key.startsWith("_"));
      return fieldListFromPairs(fields);
    }

    function fieldListFromPairs(fields) {
      return `<dl class="fields">${fields.map(([key, value]) => `<dt>${escapeHtml(key)}</dt><dd>${escapeHtml(value)}</dd>`).join("")}</dl>`;
    }

    function bindJumpButtons() {
      els.detail.querySelectorAll(".jump").forEach(button => {
        button.addEventListener("click", () => {
          state.view = button.dataset.view;
          state.selected[state.view] = button.dataset.uid;
          state.filter[state.view] = "all";
          state.query = "";
          els.search.value = "";
          renderViewTabs();
          renderFilters();
          renderItemList();
          renderDetail();
        });
      });
    }

    function sameChapterEpisodes(episodeNo) {
      const chapter = String(episodeNo).split("-")[0];
      return state.data.episodes.filter(row => String(row["话号"]).startsWith(`${chapter}-`));
    }

    function unique(values) {
      return [...new Set(values.filter(Boolean))];
    }

    function renderError(error) {
      els.detail.innerHTML = `
        <div class="detail-inner">
          <div class="error">
            <strong>数据读取失败。</strong><br>
            ${escapeHtml(error.message)}<br>
            请通过本地HTTP服务打开本页，例如 <code>http://127.0.0.1:8765/docs/superpowers/specs/story-v09-review.html</code>。
          </div>
        </div>
      `;
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function escapeAttr(value) {
      return escapeHtml(value);
    }

    els.search.addEventListener("input", () => {
      state.query = els.search.value;
      ensureSelection();
      renderItemList();
      renderDetail();
    });
  </script>
</body>
</html>
